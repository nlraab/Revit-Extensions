<!DOCTYPE html>
<html lang="en">

<title>dbHMS 3D Viewer (three.js)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a3340; }
  #c { width: 100vw; height: 100vh; display: block; outline: none; }
  #badge { position: fixed; left: 12px; bottom: 38px; font: 700 22px Segoe UI, sans-serif;
           background: rgba(20,26,33,0.55); padding: 3px 12px; border-radius: 5px;
           user-select: none; pointer-events: none; }
  #minbtn { position: fixed; left: 10px; bottom: 8px; font: 600 11px Segoe UI, sans-serif;
            color: #9fb4c8; background: rgba(20,26,33,0.40); padding: 3px 10px; border-radius: 4px;
            border: 1px solid rgba(159,180,200,0.22); cursor: pointer; user-select: none; }
  #minbtn:hover { background: rgba(20,26,33,0.78); color: #cbd5e0; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
          font: 14px Segoe UI, sans-serif; color: #cbd5e0; text-align: center; pointer-events: none; }
  #props { position: fixed; display: none; max-width: 300px; background: rgba(255,255,255,0.97);
           border: 1px solid #cbd5e0; border-radius: 4px; padding: 6px 12px; font: 12px Segoe UI, sans-serif;
           box-shadow: 0 3px 10px rgba(0,0,0,0.30); z-index: 10; pointer-events: none; }
  #props .t { font-weight: 700; color: #1A202C; margin-bottom: 4px; }
  #props .r { color: #4A5568; line-height: 1.5; }
  #props .r b { color: #2D3748; font-weight: 600; }
  /* ---- floor-plan minimap (bottom-left, above the dbHMS badge; grows up + right) ---- */
  /* transparent: the light "paper" plan is drawn into the canvas underneath; a coloured panel
     background here would tint the plan (that was the "not lighter" bug). Border only, for framing. */
  #mm { position: fixed; left: 12px; bottom: 76px; width: 240px; height: 172px; display: none;
        background: transparent; border: 1px solid rgba(45,55,72,0.45);
        border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.35); user-select: none;
        overflow: hidden; z-index: 9; }
  /* the plan is drawn here (its own canvas), so #mm's rounded corners + overflow:hidden clip it */
  #mm_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mm_label { position: absolute; left: 7px; top: 5px; font: 700 11px Segoe UI, sans-serif;
              color: #1a2330; background: rgba(236,238,236,0.85); padding: 1px 6px; border-radius: 3px;
              pointer-events: none; }
  /* camera position + heading marker */
  #mm_cam { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none;
            border-left: 7px solid transparent; border-right: 7px solid transparent;
            border-bottom: 14px solid #00BFFF; filter: drop-shadow(0 0 2px rgba(0,0,0,0.7));
            transform: translate(-50%,-50%); }
  /* resize grip (top-right corner): nested diagonal lines, classic drag-to-resize */
  #mm_grip { position: absolute; right: 1px; top: 1px; width: 16px; height: 16px;
             cursor: nesw-resize; pointer-events: auto; }
  /* ---- standalone (plain-browser) share overlay: hidden inside Revit, where the
         WPF panel provides these controls. Shown only when the page runs in a normal
         browser (no WebView2 host) so a PM has a clash list + visibility on screen. ---- */
  #share { position: fixed; top: 0; right: 0; width: 326px; height: 100%; display: none;
           flex-direction: column; background: #f7fafc; box-shadow: -3px 0 16px rgba(0,0,0,0.32);
           font: 12px Segoe UI, sans-serif; color: #2d3748; z-index: 20; }
  #share.open { display: flex; }
  #share_hd { background: #2d3748; color: #fff; padding: 12px 14px; display: flex; align-items: baseline; }
  #share_hd .ttl { font-weight: 700; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; margin-right: 8px; }
  #share_hd .wm { font: 700 18px Segoe UI, sans-serif; opacity: 0.85; }
  #share_hd .wm .a { color: #00BFFF; } #share_hd .wm .d { color: #7A8FA6; font-weight: 300; }
  #share_body { flex: 1; overflow-y: auto; padding: 12px; }
  #share .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 10px; margin-bottom: 10px; }
  #share .sh { font-weight: 600; font-size: 13px; color: #1a202c; margin: 0; cursor: pointer;
               user-select: none; display: flex; align-items: center; }
  #share .sh .caret { margin-left: auto; color: #718096; font-size: 10px; }
  #share .bd { margin-top: 8px; }

  #share .help { font-size: 11px; color: #718096; line-height: 1.55; }
  #share input[type=text] { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #cbd5e0;
                            border-radius: 3px; font: 12px Segoe UI, sans-serif; margin-bottom: 6px; }
  #share .chips { display: flex; flex-wrap: wrap; gap: 3px 12px; margin: 2px 0 6px; }
  #share label.ck { display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; }
  #share .cnt { font-size: 11px; color: #718096; margin: 2px 0 6px; }
  #share .clist { max-height: 300px; overflow-y: auto; }
  #share .crow { display: block; width: 100%; box-sizing: border-box; text-align: left; background: #edf2f7;
                 border: 1px solid #cbd5e0; border-radius: 3px; padding: 5px 8px; margin-bottom: 3px;
                 font: 11px Segoe UI, sans-serif; color: #2d3748; cursor: pointer; }
  #share .crow:hover { background: #e2eefb; border-color: #2b6cb0; }
  #share .mrow { margin: 2px 0; } #share .cats { margin: 2px 0 6px 18px; }
  #share .vbtn { display: block; width: 100%; box-sizing: border-box; text-align: left; background: #edf2f7;
                 border: 1px solid #cbd5e0; border-radius: 3px; padding: 5px 8px; margin-bottom: 3px;
                 font: 11px Segoe UI, sans-serif; color: #2d3748; cursor: pointer; }
  #share .vbtn:hover { background: #e2eefb; border-color: #2b6cb0; }
  #share_toggle { position: fixed; top: 12px; right: 12px; z-index: 21; background: #2b6cb0; color: #fff;
                  border: none; border-radius: 4px; padding: 8px 13px; font: 600 12px Segoe UI, sans-serif;
                  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: none; }
  #share_toggle.show { display: block; }
</style>
<script type="importmap">
{ "imports": {

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="badge"><span style="color:#00BFFF">db</span><span style="color:#7A8FA6"> | </span><span style="color:#00BFFF">HMS</span></div>
<div id="minbtn" title="Exit the enlarged view">minimize</div>
<div id="hint">Loading viewer…</div>
<div id="props"></div>
<div id="mm">
  <canvas id="mm_canvas"></canvas>
  <div id="mm_label"></div>
  <div id="mm_cam"></div>
  <div id="mm_grip" title="Drag to resize">
    <svg viewBox="0 0 16 16" width="16" height="16">
      <line x1="6"  y1="0" x2="16" y2="10" stroke="rgba(45,55,72,0.75)" stroke-width="1.4"/>
      <line x1="9"  y1="0" x2="16" y2="7"  stroke="rgba(45,55,72,0.75)" stroke-width="1.4"/>
      <line x1="12" y1="0" x2="16" y2="4"  stroke="rgba(45,55,72,0.75)" stroke-width="1.4"/>
    </svg>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
// N8AO: a more robust ambient-occlusion pass than three.js GTAO (which renders black on
// some NVIDIA/ANGLE/Direct3D drivers). N8AOPass REPLACES RenderPass -- it renders the
// scene AND applies AO in one pass. Vendored offline under lib/three/addons/.
import { N8AOPass } from 'three/addons/postprocessing/N8AO.js';

const canvas = document.getElementById('c');
const hint = document.getElementById('hint');
const props = document.getElementById('props');
let _hintTimer = null;
function showHint(t, fadeMs) {
  hint.textContent = t || ''; hint.style.display = t ? 'block' : 'none';
  if (_hintTimer) { clearTimeout(_hintTimer); _hintTimer = null; }
  // optional auto-dismiss so an informational notice doesn't sit over the model forever
  if (t && fadeMs) _hintTimer = setTimeout(() => { hint.style.display = 'none'; }, fadeMs);
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- renderer ----------
// NOTE: no logarithmicDepthBuffer — it's incompatible with GTAO ambient
// occlusion (and other depth-based post). Z-fighting is handled instead by
// robust bounds + tight camera-fit near/far, and (at the source) by the
// CustomExporter rebuild which won't emit Revit's coincident internal faces.
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Neutral (Khronos PBR-neutral) tone mapping: preserves material colour + contrast while
// still rolling highlights off. ACES blew out the exterior; AgX fixed that but desaturated
// everything to a flat grey (uniform in + out -- the "very grey/washed" look). Neutral keeps
// hues accurate (closer to Revit's Realistic) without the blowout. Exposure back to 1.0.
renderer.toneMapping = THREE.NeutralToneMapping;
// 1.3: the double-sRGB bug used to brighten Realistic; with that fixed, both paths render at
// the correct (darker) level, so lift exposure back up for a bright-but-not-washed interior.
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Anisotropic texture filtering: without it, textures (brick, wood, concrete) viewed at a
// grazing angle -- floors and walls receding from the camera, which is most of a walkthrough --
// go blurry and shimmer. Capped at 8 (the quality/perf sweet spot) and clamped to what the GPU
// supports, so it stays scalable across firm machines.
const MAX_ANISO = Math.min(8, (renderer.capabilities.getMaxAnisotropy && renderer.capabilities.getMaxAnisotropy()) || 1);

// WebGL context loss: a too-heavy model can trip Windows' GPU watchdog (TDR) or
// exhaust VRAM (esp. with Revit also holding the GPU) -- the context dies and the
// screen goes blank with no error. Catch it: report, stop hammering a dead context,
// and tell the user WHY instead of a silent blank-blue screen.
let glLost = false;
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true;
  try { post('diag:CONTEXT LOST (GPU reset -- model too heavy / out of GPU memory)'); } catch(_e){}
  try { showHint('Graphics reset. The model is too heavy for the GPU right now. Close and reopen '
    + 'the 3D Viewer to recover. If it keeps happening, reboot the PC, or use a smaller export scope.'); } catch(_e){}
}, false);
// A lost context destroys EVERY GPU resource (textures, buffers, shaders, render targets).
// Resuming in place (the old glLost=false) rendered garbage -- the boxed/corner image. So we
// stay down and tell the user to relaunch; a fresh page reinitialises the GPU cleanly. Do NOT
// auto-resume here.
renderer.domElement.addEventListener('webglcontextrestored', () => {
  try { post('diag:context restored (relaunch the viewer for a clean state)'); } catch(_e){} }, false);

const scene = new THREE.Scene();
const SLATE = new THREE.Color(0x2a3340);
const pmrem = new THREE.PMREMGenerator(renderer);

// Procedural gradient sky: zenith blue -> bright horizon -> warm ground. Drives
// BOTH image-based lighting (the outdoor ambient that makes PBR materials read as
// their real material) AND the visible background. A full physically-based sky
// with a movable sun + time-of-day is the Environment phase; this is its base.
function _rgb(a){ return 'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')'; }
function _mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
// --- night sky + sun as real 3D objects (NOT painted on the equirect canvas) ---
// Painting stars/sun on the low-res equirect sky stretched the stars into big blurry blobs
// and pinched the sun into a cone at the zenith (equirect POLE distortion -- everything
// converges to a point at the top). Instead the stars are a GPU point-sprite field and the
// sun is a camera-facing billboard: both stay crisp, correctly tiny, and round at ANY
// elevation. Built on a UNIT sphere and then, every frame, centered on the camera and
// scaled to sit just inside the CURRENT far plane (updateClip retunes camera.far per model,
// so a fixed huge radius gets clipped -> the bug where the sun/stars vanished). Hidden in
// Draft/slate mode. Opacity tracks the sun's elevation.
// Star glint sprite: a tiny bright core + faint 4/8-point rays ("a speck emitting light").
function _starSprite(){
  const S=64, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
  const g=cv.getContext('2d'), c=S/2;
  const core=g.createRadialGradient(c,c,0,c,c,S*0.14);
  core.addColorStop(0,'rgba(255,255,255,1)'); core.addColorStop(0.5,'rgba(244,248,255,0.8)');
  core.addColorStop(1,'rgba(210,224,255,0)');
  g.fillStyle=core; g.beginPath(); g.arc(c,c,S*0.14,0,6.2832); g.fill();
  g.globalCompositeOperation='lighter';
  function ray(ang,len,hw){ g.save(); g.translate(c,c); g.rotate(ang);
    const lg=g.createLinearGradient(0,0,len,0);
    lg.addColorStop(0,'rgba(255,255,255,0.8)'); lg.addColorStop(0.4,'rgba(255,255,255,0.18)'); lg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=lg; g.beginPath(); g.moveTo(0,-hw); g.lineTo(len,0); g.lineTo(0,hw); g.closePath(); g.fill(); g.restore(); }
  for (let k=0;k<4;k++) ray(k*Math.PI/2, S*0.47, S*0.020);            // long cross rays
  for (let k=0;k<4;k++) ray(Math.PI/4+k*Math.PI/2, S*0.27, S*0.013);  // short diagonal rays
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// Soft round sun glow (bright core -> warm faint halo). Always round = no equirect cone.
function _sunSprite(){
  const S=128, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
  const g=cv.getContext('2d'), c=S/2;
  const gr=g.createRadialGradient(c,c,0,c,c,c);
  gr.addColorStop(0.00,'rgba(255,255,255,1)'); gr.addColorStop(0.06,'rgba(255,252,246,0.95)');
  gr.addColorStop(0.16,'rgba(255,243,214,0.45)'); gr.addColorStop(0.42,'rgba(255,228,184,0.12)');
  gr.addColorStop(1.00,'rgba(255,224,176,0)');
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// GPU point-sprite star field on the sky sphere: many tiny crisp specks, a few brighter.
function _buildStarField(){
  const N=600, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  let seed=20260622; const rnd=()=>{ seed=(seed*1664525+1013904223)&0x7fffffff; return seed/0x7fffffff; };
  let n=0;
  while (n<N){
    const u=rnd()*2-1, th=rnd()*Math.PI*2, r=Math.sqrt(Math.max(0,1-u*u));
    if (u < -0.12){ continue; }                      // keep stars in the sky, not far below the horizon
    pos[n*3]=r*Math.cos(th); pos[n*3+1]=u; pos[n*3+2]=r*Math.sin(th);   // UNIT sphere; scaled per-frame
    const b=0.4+rnd()*rnd()*0.6;                     // a few bright, many faint
    col[n*3]=b; col[n*3+1]=b; col[n*3+2]=Math.min(1,b*1.05);
    n++;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({ size:10, sizeAttenuation:false, map:_starSprite(),
    transparent:true, opacity:0, depthWrite:false, depthTest:true,
    blending:THREE.AdditiveBlending, vertexColors:true });
  const pts=new THREE.Points(geo, mat); pts.frustumCulled=false; pts.userData.__env=true;
  return pts;
}
// Build an equirect sky with a movable sun. `s` = unit direction TOWARD the sun (Y-up).
// Sky warms + dims as the sun nears/drops below the horizon; a glowing sun disc is drawn
// at the sun's position, matched to three.js's equirect mapping so it lines up with the
// light direction (and the shadows it casts).
function buildSky(s){
  const W=512, H=256, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const elDeg = Math.asin(Math.max(-1,Math.min(1,s.y))) * 180/Math.PI;   // sun elevation, degrees
  const d = Math.max(0, Math.min(1, (elDeg + 4)/30));    // daylight: 0 = night (sun below ~-4), 1 = high sun
  // subtle warm band only when the sun is low but up (peaks ~4deg, gone by ~20deg / below horizon)
  const warm = Math.max(0, Math.min(1, 1 - Math.abs(elDeg - 4)/16)) * Math.min(1, d*1.6);
  const zenith  = _mix([10,12,24],  [95,150,220], d);    // dark night-blue -> day blue
  let   horizon = _mix([22,24,36],  [205,222,240], d);   // dark -> pale day haze
  horizon       = _mix(horizon, [232,170,118], warm*0.5);// gentle sunset tint (much less orange)
  const ground  = _mix([16,15,14],  [118,112,103], 0.22+0.78*d);
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0.00, _rgb(zenith));
  grad.addColorStop(0.28, _rgb(_mix(zenith,horizon,0.42)));   // smoother upper-sky gradation
  grad.addColorStop(0.46, _rgb(_mix(zenith,horizon,0.86)));
  grad.addColorStop(0.50, _rgb(horizon));
  grad.addColorStop(0.56, _rgb(_mix(horizon,ground,0.55)));   // softer, wider horizon haze (no hard line)
  grad.addColorStop(1.00, _rgb(ground));
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // The equirect canvas is now ONLY the gradient. Stars + the sun are real 3D objects
  // (_buildStarField / sunSprite, built below) -- which is what fixed the blurry star
  // blobs and the pinched sun-cone at the zenith that the canvas approach produced.
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping; tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
// sun state (azimuth + elevation in degrees, strength 0..1). Driven by the panel's
// Time of day / Sun direction / Sun strength controls via the 'sun' message.
let sunAz = 135, sunEl = 55, sunStrength = 0.7;
function sunDir(){ const a=sunAz*Math.PI/180, e=sunEl*Math.PI/180, c=Math.cos(e);
  return new THREE.Vector3(c*Math.cos(a), Math.sin(e), c*Math.sin(a)); }
let skyTex = buildSky(sunDir());
let envTex = pmrem.fromEquirectangular(skyTex).texture;
scene.environment = envTex;
// Full sky-ambient (1.0). It was dropped to 0.7 to fight a "washed out" look that turned
// out to be the double-sRGB composer bug (since fixed) -- so that reduction was a wrong
// guess that under-lit deep interior surfaces (a CMU wall reading near-black even though
// its texture + factor are correct). Back to full strength so interiors are properly lit.
scene.environmentIntensity = 1.0;
scene.background = skyTex;
let envDropped = false;   // set true if env IBL is found broken on this GPU (see verifyRender)
let bigModel = false;     // set per-load: huge models render lean (no shadow/AO) to avoid context loss
let bigModelTris = '0';   // millions, for the on-screen hint
// Interior reflection probe: a cubemap captured once inside the model. Reflective surfaces
// (glass + shiny floors) reflect THIS (the room) instead of only the sky, while matte surfaces
// keep the sky as their ambient -- so the lighting is unchanged. A single static probe is an
// approximation (one viewpoint for the whole model), good enough to read as "interior reflection".
let reflectiveMats = new Set();   // materials that should get the room probe as their envMap
let roomEnv = null, reflRT = null, reflCam = null;
// toggle sky vs flat slate (Draft uses slate + no IBL for a fast clay look)
function setSky(on){ scene.background = on ? skyTex : SLATE; scene.environment = (on && !envDropped) ? envTex : null;
  if (typeof updateGroundVisible === 'function') updateGroundVisible();
  if (typeof updateSkyElements === 'function') updateSkyElements(); }
// rebuild the sky + image-based lighting for the current sun, and re-tint the sun light
// (its DIRECTION is applied every frame in updateClip from sunDir()).
function applySun(){
  const onSky = (scene.background !== SLATE);
  const old = skyTex; skyTex = buildSky(sunDir()); if (old) old.dispose();
  const oldEnv = envTex; envTex = pmrem.fromEquirectangular(skyTex).texture; if (oldEnv) oldEnv.dispose();
  if (onSky) scene.background = skyTex;
  if (!envDropped && scene.environment) scene.environment = envTex;
  // sun fades out as it drops below the horizon (no lighting the model from beneath at night)
  const above = Math.max(0, Math.min(1, (sunEl + 2) / 12));
  // Sun dominates the ambient fill so lit vs shadowed faces clearly differ (the
  // contrast a flat sky-flooded wall lacks). AgX rolls the brighter lit faces off
  // gracefully, so this adds punch without blowing them to white.
  sun.intensity = (0.8 + 4.6*Math.max(0, Math.min(1, sunStrength))) * above;
  sun.color.setRGB(1.0, sunEl < 18 ? 0.85 : 0.95, sunEl < 18 ? 0.72 : 0.90);  // warmer when low
  if (typeof updateSkyElements === 'function') updateSkyElements();   // move/fade the 3D sun + stars
}

const sun = new THREE.DirectionalLight(0xfff2e0, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);   // 2048 keeps GPU memory modest (4096 + the
sun.shadow.bias = -0.0004;            // half-float AO composer can exhaust some GPUs)
sun.shadow.normalBias = 0.06;         // a touch more = no peter-panning at the softer radius
sun.shadow.radius = 5;                 // softer PCF penumbra (was 3) -- gentler, more natural edges
sun.shadow.blurSamples = 16;           // sample the wider penumbra evenly (avoids a banded edge)
scene.add(sun, sun.target);
// sky/ground ambient. Forward-lit (no half-float), so it always works -- if the
// image-based env lighting turns out broken on a GPU, we drop the env and lean
// on a brighter version of this.
const hemi = new THREE.HemisphereLight(0xbcd0e6, 0x6b6256, 0.45);   // interior fill so deep
scene.add(hemi);                                                     // (sunless) walls aren't black

// Sky objects (built now that the scene exists). A star field + a billboard sun.
// updateSkyElements() = STYLE (opacity/color/visibility) for the current sun.
// positionSkyObjects() = per-frame PLACEMENT (centre on camera, scale to just inside the
// current far plane) so they're never clipped and read as infinitely far.
const starField = _buildStarField(); scene.add(starField);
const sunMat = new THREE.SpriteMaterial({ map: _sunSprite(), transparent: true, depthWrite: false,
  depthTest: true, blending: THREE.AdditiveBlending });
const sunSprite = new THREE.Sprite(sunMat); sunSprite.frustumCulled = false; sunSprite.userData.__env = true;
scene.add(sunSprite);
let sunWorldDir = new THREE.Vector3(0, 1, 0);   // updated by updateSkyElements
let sunSizeFactor = 0.10;                        // angular size of the sun sprite (fraction of sky radius)
function updateSkyElements(){
  const onSky = (scene.background !== SLATE);
  const starAmt = Math.max(0, Math.min(1, (-sunEl - 2)/8));        // fade in once the sun is below the horizon
  starField.material.opacity = starAmt;
  starField.visible = onSky && starAmt > 0.01;
  sunWorldDir.copy(sunDir());
  const lowf = Math.max(0, Math.min(1, (16 - sunEl)/18));         // 1 when low, 0 when high
  sunMat.color.setRGB(1.0, 1.0 - 0.10*lowf, 1.0 - 0.30*lowf);     // warm near the horizon
  sunMat.opacity = 0.9 * Math.max(0, Math.min(1, (sunEl + 2)/6)); // fade out at/below the horizon
  sunSizeFactor = 0.085 + 0.05*lowf;                             // a touch bigger/softer when low (sunset bloom)
  sunSprite.visible = onSky && sunEl > -2;
}
// Keep the sky sphere centred on the camera and just inside the (per-frame, model-fitted)
// far plane. Called every frame AFTER updateClip + applyCameraToThree.
function positionSkyObjects(){
  const skyR = Math.max(10, camera.far * 0.9);
  starField.position.copy(camera.position);
  starField.scale.setScalar(skyR);                               // unit-sphere geometry -> radius skyR
  sunSprite.position.copy(camera.position).addScaledVector(sunWorldDir, skyR);
  const sc = skyR * sunSizeFactor;
  sunSprite.scale.set(sc, sc, 1);
  // ground dissolves into the sky between ~0.55 and ~0.92 of the (model-fitted) far plane
  groundFade.s.value = camera.far * 0.55;
  groundFade.e.value = camera.far * 0.92;
}
updateSkyElements();   // initial style; positionSkyObjects() runs in the frame loop (after `camera` exists)

// ---- ground plane -----------------------------------------------------------
// The building was floating in the bright sky with nothing under it -- a big part
// of the "washed out" read. A large matte ground catches the sun's shadow (a real
// contact shadow grounds the building and adds the contrast a flat white wall lacks)
// and gives the silhouette something other than pale sky to sit against. It's NOT a
// model element: added straight to the scene (not `root`), so it stays out of
// selection, visibility, bounds and the element list.
const groundMat = new THREE.MeshStandardMaterial({ color: 0x9298a0, roughness: 0.98, metalness: 0.0 });
// Fade the ground to transparent with distance FROM THE CAMERA so it dissolves into the sky
// toward the horizon -- no visible plane edge, "a pedestal that goes on forever". Camera-
// relative (not the plane's fixed rim) so the dissolve always finishes before the far plane
// (no hard clip line) and tracks the view like haze. Range set per-frame from camera.far
// in positionSkyObjects(). Uses vViewPosition (camera-space position) whose length = distance.
groundMat.transparent = true;

  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform float uFadeS;\nuniform float uFadeE;')

ground.receiveShadow = true;
ground.castShadow = false;
ground.visible = false;               // shown once a model is placed (and only on sky modes)
ground.userData.__env = true;
scene.add(ground);
// User "Show ground" toggle (panel chk_ground -> 'ground' message). The ground sits BELOW
// the whole model so it never hides underground plumbing/foundations -- it's a clean
// reference floor, not real grade (real grade would have to cut through the model and
// occlude the very things being reviewed). Actual visibility also requires a sky mode + a
// loaded model, so this combines all three conditions in one place.
let groundOn = true;
function updateGroundVisible(){

function setGround(on){ groundOn = !!on; updateGroundVisible(); }
function placeGround(){
  if (!bounds) return;
  const span = Math.max(bounds.span || bounds.radius * 2, 4);
  ground.scale.set(span * 12, span * 12, 1);   // reads as "the ground", covers the shadow frustum
  // Place at the TRUE bottom of all geometry (boxMin.y = the model AABB min, below every
  // element) so nothing -- pipes, footings -- ever pokes under or is hidden by the ground.
  const baseY = (bounds.boxMin ? bounds.boxMin.y
              : (bounds.minY !== undefined ? bounds.minY : bounds.center.y - bounds.radius));
  ground.position.set(bounds.center.x, baseY - span * 0.001, bounds.center.z);

// AO is the single biggest "looks rendered" cue (soft darkening in corners and
// where elements meet). Composited through EffectComposer; OutputPass does the
// tone map + sRGB. Toggled by quality tier (off in Draft).
// On this stack (NVIDIA RTX via ANGLE/Direct3D11, dpr 1.5) the composer renders FINE
// to an offscreen 8-bit target but draws BLACK when it writes directly to the screen
// (default framebuffer); a plain renderer.render() to the screen is always fine. So we
// render the composer to an OFFSCREEN 8-bit target and then copy that target to the
// screen with a plain fullscreen-quad pass -- a composite of two operations we've each
// proven work, sidestepping the broken composer->screen write entirely.
const _composerRT = new THREE.WebGLRenderTarget(
  Math.max(2, renderer.domElement.width), Math.max(2, renderer.domElement.height),
  { type: THREE.UnsignedByteType });   // 8-bit, NO multisample (MSAA-resolve is a suspect on ANGLE/NVIDIA)
const composer = new EffectComposer(renderer, _composerRT);

const n8ao = new N8AOPass(scene, camera,
  Math.max(2, renderer.domElement.width), Math.max(2, renderer.domElement.height));

  n8ao.configuration.aoRadius = 1.8;        // metres; a touch wider = richer contact shading

  n8ao.configuration.intensity = 3.3;       // AO strength (a bit stronger)
  n8ao.configuration.halfRes = false;       // full-res avoids the sky-darkening half-res issue

  // converges to a clean, smooth, high-sample result (like Enscape/Lumion settling) without
  // paying that cost every frame. N8AO auto-resets the accumulation the instant the camera
  // moves, so there's no ghosting -- moving looks like normal Medium AO, idle looks far better.
  n8ao.configuration.accumulate = true;

// framebuffer (Shaded). Realistic goes through N8AO, which renders the scene into its own
// beautyRenderTarget -- created WITHOUT multisampling, so every edge there is jagged/grainy.
// Turning on MSAA for that target makes Realistic as crisp as Shaded. Set via .samples so we
// don't edit the vendored addon; it survives N8AO.setSize(). If a GPU can't multisample this
// target the composer would black out, and verifyRender() already self-heals to the plain
// (antialiased) render -- so this only ever IMPROVES quality, never breaks the view.
const AA_SAMPLES = 4;                        // matches a typical antialias:true (4x); GPU-cheap

// sRGB). Adding OutputPass applied a SECOND sRGB encode, which lifted the midtones and made
// Realistic look brighter/washed than Shaded (measured: composer mean ~= plain^(1/2.2)).
// With it gone, the composer (Realistic) matches the plain (Shaded) render plus the AO.

// fullscreen-quad blit of the composer's (already display-ready, sRGB) output texture
// straight to the screen. RawShaderMaterial = no extra color conversion (1:1 copy).
const _blitScene = new THREE.Scene();
const _blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const _blitMat = new THREE.RawShaderMaterial({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'attribute vec3 position; attribute vec2 uv; varying vec2 vUv;' +
                'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',

_blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), _blitMat));
function blitComposerToScreen(){
  _blitMat.uniforms.tDiffuse.value = composer.readBuffer.texture;   // OutputPass result
  renderer.setRenderTarget(null);
  renderer.render(_blitScene, _blitCam);
}

// Some GPUs/drivers (seen in Revit's WebView2/ANGLE) choke on the half-float
// textures used by image-based env lighting and the AO composer, rendering the
// GEOMETRY pitch-black while the sky stays fine. verifyRender() runs once after a
// model loads and self-heals: (1) if removing the env map makes the scene BRIGHTER,
// the env IBL is broken here -> drop it + brighten the plain sky/sun lighting;
// (2) if the AO composer is black while the plain render is lit -> turn AO off.
// Conservative thresholds: on a healthy GPU neither triggers. Never worse than a
// plain lit render.
// composerOK starts FALSE: Realistic renders via the plain lit path (always works)
// until verifyRender PROVES the AO composer draws to screen without blacking the
// geometry. So the worst case is a lit Realistic without AO -- never a black model.
let composerOK = false, renderChecked = false;
// center sampling region (middle ~36% of the canvas, where the framed model sits)
function _region(){ const w=renderer.domElement.width, h=renderer.domElement.height;
  return { w, h, rx:Math.floor(w*0.32), ry:Math.floor(h*0.32), rw:Math.max(8,Math.floor(w*0.36)), rh:Math.max(8,Math.floor(h*0.36)) }; }
// fraction of near-black pixels in the center from a fresh DIRECT (RGBA8) render.
// Measures the actual symptom (pitch-black geometry) directly, so the bright sky
// can't dilute it the way an average would.
function _directBlackFrac(){
  const R = _region(); const prevRT = renderer.getRenderTarget();
  const tmp = new THREE.WebGLRenderTarget(R.w, R.h);
  renderer.setRenderTarget(tmp); renderer.clear(); renderer.render(scene, camera);
  const px = new Uint8Array(R.rw*R.rh*4); renderer.readRenderTargetPixels(tmp, R.rx, R.ry, R.rw, R.rh, px);
  renderer.setRenderTarget(prevRT); tmp.dispose();
  let black=0, n=R.rw*R.rh; for (let i=0;i<px.length;i+=4){ if (px[i]+px[i+1]+px[i+2] < 16) black++; }

// an offscreen buffer yet draw black to the screen on some GPUs (the real symptom).

  let black=0, n=R.rw*R.rh; for (let i=0;i<px.length;i+=4){ if (px[i]+px[i+1]+px[i+2] < 16) black++; }

// report the ACTUAL GPU/renderer + key WebGL capabilities, so we can tell whether
// WebView2 is on the real GPU or fell back to software (SwiftShader), and whether
// float render targets (used by the AO composer) are even supported here.
function gpuInfo(){
  try {
    const gl = renderer.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const rend = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    const vend = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    post('diag:gpu renderer="' + rend + '" vendor="' + vend + '"' +
         ' ver="' + gl.getParameter(gl.VERSION) + '"' +
         ' colorBufFloat=' + !!gl.getExtension('EXT_color_buffer_float') +
         ' colorBufHalfFloat=' + !!gl.getExtension('EXT_color_buffer_half_float') +
         ' maxTex=' + gl.getParameter(gl.MAX_TEXTURE_SIZE) +

function verifyRender(){
  if (!root || renderChecked) return;
  const w = renderer.domElement.width, h = renderer.domElement.height;
  if (w < 16 || h < 16) return;   // wait for a real canvas size
  renderChecked = true;
  gpuInfo();
  const _gl = renderer.getContext();
  if (glLost || (_gl.isContextLost && _gl.isContextLost())){
    try { post('diag:render-check skipped (context lost)'); } catch(_e){} return;
  }

    // --- env-lighting check: does the env map blacken the geometry on this GPU? ---
    const blackOn = _directBlackFrac();           // with env IBL on
    const savedEnv = scene.environment;
    scene.environment = null;
    const blackOff = _directBlackFrac();           // with env IBL off
    if (blackOn > 0.12 && (blackOn - blackOff) > 0.08){
      // a big black region with the env on that disappears without it -> env IBL is broken here
      envDropped = true; hemi.intensity = 0.75;    // keep env off, brighten the plain sky/sun ambient
      post('diag:env fallback(env IBL blacks geometry) blackOn=' + blackOn.toFixed(2) + ' blackOff=' + blackOff.toFixed(2));
    } else {
      scene.environment = savedEnv;                // env is fine; keep it
      post('diag:env ok blackOn=' + blackOn.toFixed(2) + ' blackOff=' + blackOff.toFixed(2));
    }
    // --- 4-way probe: isolate exactly which stage goes black on THIS GPU ---
    // plainScreen : plain render -> screen           (known-good baseline)
    // plainRT     : plain render -> 8-bit offscreen RT (does render-to-target work at all?)
    // composerRT  : full composer -> its offscreen buffer (does the post pipeline work offscreen?)
    // composerScr : composer offscreen + blit -> screen (the path Realistic uses)
    const cw = renderer.domElement.width, ch = renderer.domElement.height;
    if (cw >= 200 && ch >= 120){
      const R = _region();
      function rtBlack(rt){ const px=new Uint8Array(R.rw*R.rh*4);
        renderer.readRenderTargetPixels(rt, R.rx, R.ry, R.rw, R.rh, px);
        let b=0,n=R.rw*R.rh; for(let i=0;i<px.length;i+=4){ if(px[i]+px[i+1]+px[i+2]<16)b++; } return b/n; }
      const prevRT = renderer.getRenderTarget();
      // plainRT: plain scene render into an 8-bit offscreen target
      const testRT = new THREE.WebGLRenderTarget(cw, ch, { type: THREE.UnsignedByteType });
      renderer.setRenderTarget(testRT); renderer.clear(); renderer.render(scene, camera);
      const plainRT = rtBlack(testRT);
      renderer.setRenderTarget(prevRT); testRT.dispose();
      // composerRT: the N8AO composer (scene + AO) into its own offscreen buffer
      composer.render();
      const composerRT = rtBlack(composer.readBuffer);
      // composerScr: blit that to the screen (the path Realistic uses)
      blitComposerToScreen();
      const composerScr = _screenBlackFrac();
      // plainScreen baseline
      renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
      const plainScreen = _screenBlackFrac();
      composerOK = (composerScr - plainScreen) < 0.10;
      post('diag:ao ' + (composerOK ? 'enabled(N8AO ok)' : 'disabled(N8AO black -> plain render)') +
           ' plainScreen=' + plainScreen.toFixed(2) + ' plainRT=' + plainRT.toFixed(2) +
           ' composerRT=' + composerRT.toFixed(2) + ' composerScr=' + composerScr.toFixed(2));
    } else {
      post('diag:ao skipped(canvas ' + cw + 'x' + ch + ') -> staying on plain render');
    }
  } catch(e){ try { post('diag:render-check error ' + (e&&e.message?e.message:e)); } catch(_e){} }
}
function tuneAO(){
  // scale the AO radius to the model so contact shading reads at building scale

const cam = { pos: [0, 0, 0], yaw: 0, pitch: 0 };

let lockPending = false;
let lastX = 0, lastY = 0, prevT = 0;
let userSpeed = 4.0, userLook = 0.10;
const PITCH_LIMIT = Math.PI / 2 - 0.02;
function lookRad(){ return userLook * Math.PI / 180; }
function forwardVec(){ const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return [cp * Math.sin(cam.yaw), sp, -cp * Math.cos(cam.yaw)]; }
function rightVec(){ return [Math.cos(cam.yaw), 0, Math.sin(cam.yaw)]; }
function applyCameraToThree(){
  const f = forwardVec();

// ---------- model state ----------
const loader = new GLTFLoader();
let root = null;                 // loaded glTF scene
let elements = [];               // [{obj, meta, model, category, workset, center, box, elemId, ...}]
let pickables = [];              // meshes for raycasting (small-model path only)
// Merged path (big models): per-element meshes are fused into a few large meshes by
// material to cut draw calls ~1000x, so the full shadow+AO pipeline can run without
// tripping the GPU. Selection then uses GPU picking (an offscreen id pass) and
// visibility a per-vertex _vis attribute, since there's no longer one object per
// element. Small models keep the proven per-object path untouched.

let mergedRoot = null;           // group holding mergedMeshes
let bounds = null;               // {center:THREE.Vector3, radius}
let assetExtras = {};
const hiddenModel = {}, hiddenCat = {}, hiddenWs = {};
const SEP = '||';
function catKey(e){ return e.model + SEP + e.category; }
function wsKey(e){ return e.model + SEP + e.workset; }

function disposeModel(){
  // interior reflection probe: drop the per-model reflective set + its env texture (the
  // cube RT + camera are reused across loads)
  reflectiveMats = new Set();
  if (roomEnv){ roomEnv.dispose(); roomEnv = null; }
  // merged meshes (big-model path): their geometry is ours, materials are shared with root
  if (mergedRoot){
    scene.remove(mergedRoot);
    for (const m of mergedMeshes){ if (m.geometry) m.geometry.dispose(); }
    mergedRoot = null;
  }
  mergedMeshes = []; merged = false;
  if (!root){ elements = []; pickables = []; clearSelection(); clearMarkers(); return; }
  scene.remove(root);
  root.traverse(o => { if (o.isMesh){ if (o.geometry) o.geometry.dispose(); if (o.material){ if (o.material.map) o.material.map.dispose(); o.material.dispose(); } } });
  root = null; elements = []; pickables = [];

}

// "Show edges" (Revit shaded-with-edges look). SCREEN-SPACE edge detection: render the
// MODEL's depth to an offscreen target, then a fullscreen pass draws thin dark lines where
// the depth JUMPS (silhouettes / where elements meet) or the surface NORMAL breaks (creases,
// room corners). Cost scales with screen resolution, not triangle count, and adds almost no
// GPU memory -- so it behaves the same on a 50k-tri model and on the merged multi-million-tri
// model, where the old per-element line geometry was impossible (merged away + far too heavy).
// Off by default => zero cost until enabled. Only MODEL meshes carry EDGE_LAYER, so the
// ground/sky are excluded from the depth pass => no false horizon line, edges on the model only.
const EDGE_LAYER = 1;
let edgesOn = false, edgeDepthRT = null;
function ensureEdgeRT(w, h){
  if (edgeDepthRT && edgeDepthRT.width === w && edgeDepthRT.height === h) return;
  if (edgeDepthRT){ if (edgeDepthRT.depthTexture) edgeDepthRT.depthTexture.dispose(); edgeDepthRT.dispose(); }
  edgeDepthRT = new THREE.WebGLRenderTarget(w, h, { depthBuffer: true });
  edgeDepthRT.depthTexture = new THREE.DepthTexture(w, h, THREE.UnsignedIntType);

const _edgeScene = new THREE.Scene();
const _edgeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const _edgeMat = new THREE.RawShaderMaterial({
  uniforms: {
    tDepth:       { value: null },
    texel:        { value: new THREE.Vector2() },
    uProjInv:     { value: new THREE.Matrix4() },
    depthThresh:  { value: 0.03 },   // relative depth jump => silhouettes / where elements meet
    normalThresh: { value: 0.12 },   // 1 - dot(normal) => creases / corners (ignores gentle curves)
    edgeColor:    { value: new THREE.Color(0x2b3340) },

    'attribute vec3 position; attribute vec2 uv; varying vec2 vUv;' +

  fragmentShader:

    '  float dC = rd(vUv); if (dC > 0.9999){ discard; }' +                        // sky/empty: no edge
    '  vec2 ox = vec2(texel.x,0.0), oy = vec2(0.0,texel.y);' +
    '  float dR=rd(vUv+ox), dL=rd(vUv-ox), dU=rd(vUv+oy), dD=rd(vUv-oy);' +
    '  vec3 pC=vp(vUv,dC), pR=vp(vUv+ox,dR), pL=vp(vUv-ox,dL), pU=vp(vUv+oy,dU), pD=vp(vUv-oy,dD);' +
    '  float zc = -pC.z;' +                                                        // eye distance
    '  float jump = max(max(abs(pR.z-pC.z),abs(pL.z-pC.z)),max(abs(pU.z-pC.z),abs(pD.z-pC.z)))/zc;' +

  const w = renderer.domElement.width, h = renderer.domElement.height;

  renderer.setRenderTarget(edgeDepthRT);

function onLoaded(gltf){

      const box = new THREE.Box3().setFromObject(o);
      const center = box.getCenter(new THREE.Vector3());
      const e = { obj: o, meta: o.userData, model: o.userData.model || 'Model',
                  category: o.userData.category || 'Other', workset: o.userData.workset || '',
                  center: center, box: box, elemId: elements.length };

           ' tris=' + Math.round(tris));

  // (AO is off there); the merged path runs the full pipeline, so it gets checked.
  if (!usedLean) setTimeout(verifyRender, 900);

// Heavy-model guard. A federated MEP model can be millions of triangles. The merged path
// handles that by cutting draw calls, but if merging is unavailable we fall back to a lean
// single-pass lit render (no shadow map, no AO, lower pixel ratio) so the model still shows
// instead of tripping the GPU watchdog (TDR)/VRAM -> lost context -> blank screen.
const BIG_MODEL_TRIS = 2500000;
function countTris(){
  let tris = 0;
  for (const e of elements){
    const g = e.obj && e.obj.geometry;
    if (g){ const idx = g.index;
      tris += idx ? idx.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0); }
  }

function applyLean(){
  renderer.setPixelRatio(1.0);
  renderer.shadowMap.enabled = false;
  scene.traverse(o => { if (o.isMesh){ o.castShadow = false; if (!o.userData.__env) o.receiveShadow = false; } });
  aoEnabled = false; composerOK = false; renderChecked = true;   // never run the AO path/probe
}
// Trim GPU memory for a heavy model so it's less likely to reset the driver. Geometry is the
// bulk (the real fix is compression), but a smaller shadow map is free + safe. (Pixel ratio is
// already forced to 1.0 for big models on the merged path.)
function applyBigModelMemory(){
  try {
    sun.shadow.mapSize.set(1024, 1024);                  // 2048 -> 1024 = 1/4 the shadow-map VRAM
    if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }   // recreate at new size
  } catch(e){}
}

// Choose the probe point: try a few candidates across the footprint (centre + corners,
// eye height) and pick the most OPEN one. A point stuck inside a solid captures a dark,
// near-uniform cube; an open point sees lit surfaces + sky-through-openings. Scoring by mean
// brightness (cheap 16px cube) auto-avoids the "probe ended up inside a wall" case without
// any geometry analysis -- so it stays robust across unknown models.
let scoreRT = null, scoreCam = null;
function _bestProbePoint(){
  const c = bounds.center, span = bounds.span || 10;
  const y = (bounds.minY !== undefined ? bounds.minY : c.y) + Math.min(2.0, span * 0.08);
  // INTERIOR: the model centre is open interior space -- it reflects the ROOM, not the sky.
  // Use it unless it's stuck inside solid geometry (a near-black capture), then nudge to a
  // nearby interior point. We deliberately do NOT pick the "brightest" candidate: brightest =
  // sees the most sky = OUTSIDE, which is the wrong thing to reflect (that was the regression).
  const o = span * 0.12;
  const cands = [ new THREE.Vector3(c.x, y, c.z),
                  new THREE.Vector3(c.x, y + span * 0.15, c.z),
                  new THREE.Vector3(c.x + o, y, c.z), new THREE.Vector3(c.x - o, y, c.z),
                  new THREE.Vector3(c.x, y, c.z + o), new THREE.Vector3(c.x, y, c.z - o) ];

// Capture the scene into a cubemap from an open point INSIDE the model, then make reflective
// materials reflect THAT (the room) instead of the sky. One-time, low-res, fully defensive:
// on any failure the surfaces just keep their sky reflection. The face renders are a brief
// one-off at load (cheap on the merged model); the cubemap itself is a few MB.
function captureReflectionProbe(){

    bpUniforms.bpBoxMax.value.copy(bounds.boxMax);

      m.envMap = roomEnv;

  }

// Shared box-projection uniforms (the probe point + the room box). One set, referenced by

const bpUniforms = { bpProbePos: { value: new THREE.Vector3() },

//    hide individual elements (a category/workset toggle) without re-splitting geometry.
//  doBox: box-project the reflection vector so a single interior cubemap reads correctly for
//    each surface's own position (parallax) -- glass panes across a wall then differ. Only the
//    specular reflection (getIBLRadiance) is remapped; diffuse ambient (getIBLIrradiance) is

// element records its (mergedMesh, vStart, vCount) so visibility can address its vertices.
function buildMerged(){

        pos[o3+1] = m[1]*x + m[5]*y + m[9]*z  + m[13];

// Robust bounds from element centers (a few stray elements can't hijack it).
function computeBounds(ctrs){
  if (!ctrs.length){ bounds = { center: new THREE.Vector3(), radius: 10, minY: -10, span: 20,
    boxMin: new THREE.Vector3(-10,-10,-10), boxMax: new THREE.Vector3(10,10,10) }; return; }
  let sx=0,sy=0,sz=0,sq=0;
  for (const c of ctrs){ sx+=c.x; sy+=c.y; sz+=c.z; sq+=c.x*c.x+c.y*c.y+c.z*c.z; }
  const n = ctrs.length, cx=sx/n, cy=sy/n, cz=sz/n;
  const rms = Math.sqrt(Math.max(0, sq/n - (cx*cx+cy*cy+cz*cz)));
  const full = new THREE.Box3().setFromObject(root);
  const fr = full.getSize(new THREE.Vector3()).length() / 2 || 10;
  bounds = { center: new THREE.Vector3(cx,cy,cz), radius: Math.min(fr, Math.max(2, rms*2.5)),
             minY: (isFinite(full.min.y) ? full.min.y : cy - fr),   // true base for the ground plane
             span: fr * 2,                                          // true diameter, for ground size
             boxMin: full.min.clone(), boxMax: full.max.clone() };  // AABB = the reflection box
}

function frameCamera(){
  const c = bounds.center, R = bounds.radius;
  cam.pos = [c.x + R*0.9, c.y + R*0.5, c.z + R*1.7];
  const dir = [c.x-cam.pos[0], c.y-cam.pos[1], c.z-cam.pos[2]];
  const dl = Math.hypot(dir[0],dir[1],dir[2]) || 1;
  cam.yaw = Math.atan2(dir[0]/dl, -dir[2]/dl);
  cam.pitch = Math.asin(Math.max(-1, Math.min(1, dir[1]/dl)));
  vel = [0,0,0];
  updateClip();
}
function updateClip(){
  if (!bounds) return;
  const d = Math.hypot(cam.pos[0]-bounds.center.x, cam.pos[1]-bounds.center.y, cam.pos[2]-bounds.center.z);
  camera.near = 0.05;
  camera.far = d + bounds.radius * 3 + 50;          // log depth keeps precision across this
  camera.updateProjectionMatrix();
  const r = bounds.radius;
  sun.position.copy(bounds.center).addScaledVector(sunDir(), r*3);   // light from the current sun direction
  sun.target.position.copy(bounds.center);
  const sc = sun.shadow.camera;
  sc.left=-r; sc.right=r; sc.top=r; sc.bottom=-r; sc.near=0.1; sc.far=r*8+50; sc.updateProjectionMatrix();
}

// ---------- visibility ----------
function recomputeVisibility(){
  markPlanDirty();   // the minimap reflects category/workset/model toggles too
  if (merged){
    // merged path: there's no per-element object to hide, so toggle the per-vertex _vis
    // attribute over each element's vertex range (the shader discards _vis < 0.5) and
    // re-upload only the merged meshes whose data actually changed.
    const dirty = new Set();
    for (const e of elements){
      if (e.mergedMesh === undefined || e.mergedMesh === null) continue;
      const v = (hiddenModel[e.model] || hiddenCat[catKey(e)] || hiddenWs[wsKey(e)]) ? 0 : 1;
      const arr = e.mergedMesh.geometry.attributes._vis.array;
      let changed = false;
      for (let k = 0; k < e.vCount; k++){ const j = e.vStart + k; if (arr[j] !== v){ arr[j] = v; changed = true; } }
      if (changed) dirty.add(e.mergedMesh);
    }
    dirty.forEach(m => { m.geometry.attributes._vis.needsUpdate = true; });
    return;
  }
  for (const e of elements){
    e.obj.visible = !(hiddenModel[e.model] || hiddenCat[catKey(e)] || hiddenWs[wsKey(e)]);
  }
}
function reportFilters(){
  const byModel = {};
  for (const e of elements){
    const m = byModel[e.model] || (byModel[e.model] = { cats:{}, ws:{} });
    m.cats[e.category] = true; if (e.workset) m.ws[e.workset] = true;
  }
  // Match the WebGL viewer's exact shape so the WPF panel parses it unchanged.
  const models = Object.keys(byModel).sort().map(m => ({ name:m,
    categories:Object.keys(byModel[m].cats).sort(),
    worksets:Object.keys(byModel[m].ws).sort() }));
  post('filters:' + JSON.stringify({ models: models }));
  // Standalone (plain browser): no WPF panel to receive `filters:`, so fill the
  // in-page show/hide list + enable the minimap now that the glb is loaded.
  if (typeof STANDALONE !== 'undefined' && STANDALONE) shareOnModelLoaded(models);
}

// ---------- selection (raycasting) ----------
const raycaster = new THREE.Raycaster();
let hoverEl = null, pinnedEl = null, hlBox = null, lastHoverPickT = 0;
// GPU picking (merged path): per-element meshes are gone, so we identify an element by
// rendering the merged meshes with a material that writes each element's id as a color,
// then reading the one pixel under the cursor. Respects _vis (hidden = not pickable).
let pickRT = null;
const pickMat = new THREE.ShaderMaterial({
  vertexShader:

// ---------- floor-plan minimap ----------
// A live top-down plan of the floor you're standing on, drawn into its own 2D canvas in the
// bottom-left corner (rounded to the panel). No Revit query at runtime: the exporter already
// stamped each element's Revit LEVEL into glTF extras (see custom_export / revit_geometry), so we
// group elements by level here, fold the junk datum/reference levels into real STORIES, and pick
// the story the camera's height sits in. The plan re-renders (off-screen, then copied to the 2D
// canvas) only when the floor / visibility / size changes; the marker is a DOM overlay every frame.
const mm = document.getElementById('mm'), mmLabel = document.getElementById('mm_label'),

      mmCanvas = document.getElementById('mm_canvas'), mmCtx = mmCanvas.getContext('2d');

let activeFloor = 0, mmEnabled = false, planDirty = false;
let planRT = null, planMaskRT = null;

let planBox = null, planScale = 1, planCx = 0, planCz = 0;

// a TRUE SECTION CUT: a horizontal plane slices the model at ~waist height and we stencil-cap the
// solids it passes through, so a wall fills its real footprint on EVERY floor it crosses (a plain
// top-down render only fills a wall on the floor where it has a flat top/bottom face). The cut also
// makes per-floor filtering exact -- only solids the plane actually passes through show.
const PLAN_PAPER = new THREE.Color(0xeceeec);   // very light paper-grey background

const PLAN_CATS = ['wall','column','door','window','curtain','stair','railing'];
function isPlanCat(cat){ const c = (cat||'').toLowerCase();

const PLAN_LAYER = 2;            // small-model path: shell element meshes get this layer
const planClip = new THREE.Plane(new THREE.Vector3(0,-1,0), 0);   // keeps y <= constant (set per floor)
// Section-cut stencil materials: render shell back faces (increment) + front faces (decrement) under

const planStencilFront = makeStencilMat(THREE.FrontSide, THREE.DecrementWrapStencilOp, false);
const planStencilBackM  = makeStencilMat(THREE.BackSide,  THREE.IncrementWrapStencilOp, true);

planCapScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), planCapMat));

const planCompositeMat = new THREE.ShaderMaterial({
  uniforms: { tMask:{value:null}, uTexel:{value:new THREE.Vector2()},
    uPaper:{value:PLAN_PAPER}, uInk:{value:new THREE.Color(0x2c323b)}, uInk2:{value:new THREE.Color(0x232934)},

  vertexShader: 'varying vec2 vUv;\nvoid main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',

    'uniform vec3 uPaper; uniform vec3 uInk; uniform vec3 uInk2; uniform vec3 uEdge; uniform float uSpace;\n' +
    'void main(){\n' +
    '  float maxM=0.0, minM=1.0;\n' +
    '  for(int dy=-1;dy<=1;dy++){ for(int dx=-1;dx<=1;dx++){\n' +
    '    float m = texture2D(tMask, vUv+vec2(float(dx),float(dy))*uTexel).r;\n' +
    '    maxM=max(maxM,m); minM=min(minM,m); } }\n' +
    '  if(maxM<0.5){ gl_FragColor=vec4(uPaper,1.0); return; }       // paper\n' +
    '  if(minM<0.5){ gl_FragColor=vec4(uEdge,1.0); return; }        // wall outline\n' +
    '  float h = step(0.5, fract((gl_FragCoord.x+gl_FragCoord.y)/uSpace));\n' +
    '  gl_FragColor = vec4(mix(uInk, uInk2, h), 1.0);              // hatched wall fill\n' +
    '}',

const planCompositeScene = new THREE.Scene();
planCompositeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), planCompositeMat));
const CAM_UP = 1000;       // park the plan camera far above; near/far carve out the cut band
function markPlanDirty(){ planDirty = true; }

// Decide the plan's element filter. Count shell elements; if a model has no walls modelled, fall
// back to showing everything (better an MEP plan than a blank box). On the merged path, bake a
// per-vertex _planMask so the fused meshes can still be filtered in the shader.
function setupPlanFilter(){
  let shell = 0; for (const e of elements) if (e._plan) shell++;
  planHasShell = shell > 0;
  if (!merged) return;   // merged geometry is fused -> bake a per-vertex shell mask for the cut shader
  for (const mesh of mergedMeshes){
    const n = mesh.geometry.attributes.position.count;
    mesh.geometry.setAttribute('_planMask', new THREE.BufferAttribute(new Float32Array(n), 1));
  }
  for (const e of elements){ if (!e._plan || !e.mergedMesh) continue;
    const arr = e.mergedMesh.geometry.attributes._planMask.array;
    for (let k = 0; k < e.vCount; k++) arr[e.vStart + k] = 1; }

function _percentile(arr, p){ if (!arr.length) return 0; const a = arr.slice().sort((x,y)=>x-y);
  return a[Math.min(a.length-1, Math.max(0, Math.floor(p*(a.length-1))))]; }
// One robust XZ footprint for the whole building (architectural shell; all elements if no shell),
// shared by every floor so scale + position are identical. Outlier rejection uses a GENEROUS IQR
// fence on element centres (drops only true strays, e.g. a survey point miles away) and then takes
// the FULL extent of the inliers -- so real perimeter walls are never cropped.
function computePlanBox(){
  const src = elements.filter(e => planHasShell ? e._plan : true);
  if (!src.length){ planBox = {minX:-5,maxX:5,minZ:-5,maxZ:5}; return; }
  const fence = (vals) => { const a = vals.slice().sort((x,y)=>x-y);
    const q1 = a[Math.floor(a.length*0.25)], q3 = a[Math.floor(a.length*0.75)];
    const iqr = Math.max(1e-3, q3-q1); return [q1 - 4*iqr, q3 + 4*iqr]; };
  const [xlo,xhi] = fence(src.map(e=>e.center.x)), [zlo,zhi] = fence(src.map(e=>e.center.z));
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for (const e of src){ const c = e.center;
    if (c.x<xlo||c.x>xhi||c.z<zlo||c.z>zhi) continue;   // skip stray outliers, keep all real geometry
    if(e.box.min.x<minX)minX=e.box.min.x; if(e.box.max.x>maxX)maxX=e.box.max.x;
    if(e.box.min.z<minZ)minZ=e.box.min.z; if(e.box.max.z>maxZ)maxZ=e.box.max.z; }

// Turn the model's Revit levels into walkable STORIES. Two cleanups make "level" mean "floor":
// (1) levels with almost no geometry are datum/reference levels (T.O. steel, parapet, ceiling
//     refs) -> drop them. (2) levels within one story-height of each other are sub-levels of the
//     same floor -> fold together. We band purely by elevation, so mismatched level NAMES across
//     the host + linked architectural models don't matter.
function buildFloors(){
  floors = []; activeFloor = 0;
  const modelTop = (bounds && bounds.boxMax) ? bounds.boxMax.y : 0;
  const modelBot = (bounds && bounds.boxMin) ? bounds.boxMin.y : 0;
  const byLevel = {};
  for (const e of elements){ const lv = e.meta && e.meta.level; if (!lv) continue;
    (byLevel[lv] || (byLevel[lv] = [])).push(e); }
  const names = Object.keys(byLevel);
  if (!names.length){   // no level data at all: one story spanning the whole model
    floors = [{ name:'Model', baseY:modelBot, topY:modelTop+1 }]; return; }
  let cand = names.map(nm => { const els = byLevel[nm];
    return { name:nm, y:_percentile(els.map(e=>e.box.min.y), 0.15), count:els.length }; });
  cand.sort((a,b)=>a.y-b.y);
  const maxCount = cand.reduce((m,c)=>Math.max(m,c.count), 0);
  let kept = cand.filter(c => c.count >= Math.max(6, maxCount*0.05));
  if (!kept.length) kept = cand;
  const MIN_STORY = 2.0;   // metres; levels closer than this fold into the lower one
  const stories = [];
  for (const c of kept){ const last = stories[stories.length-1];
    if (last && (c.y - last.y) < MIN_STORY){ if (c.count > last._c){ last.name = c.name; last._c = c.count; } }
    else stories.push({ name:c.name, y:c.y, _c:c.count }); }
  for (let i=0;i<stories.length;i++){ stories[i].baseY = stories[i].y;
    stories[i].topY = (i+1<stories.length) ? stories[i+1].y : (modelTop+1); }

}

function pickFloor(){ if (!floors.length) return 0; const y = cam.pos[1]; let idx = 0;
  for (let i=0;i<floors.length;i++){ if (y >= floors[i].baseY - 0.3) idx = i; } return idx; }
function updateActiveFloor(){ const want = pickFloor();
  if (want !== activeFloor){ activeFloor = want; markPlanDirty(); } }

function ensurePlanRT(w, h){
  if (planRT && planRT.width === w && planRT.height === h) return;
  if (planRT) planRT.dispose();
  if (planMaskRT) planMaskRT.dispose();
  planRT = new THREE.WebGLRenderTarget(w, h); planRT.texture.colorSpace = THREE.SRGBColorSpace;
  planMaskRT = new THREE.WebGLRenderTarget(w, h, { stencilBuffer:true });   // section-cut mask (needs stencil)

// Render the current floor's plan to planRT (section-cut walls on paper), then copy it onto the 2D

const PLAN_SS = 3.5;   // internal supersample factor for finer detail (downscaled to the panel)
function renderPlanToRT(){
  if (!floors.length || !planBox) return; const s = floors[activeFloor]; if (!s) return;
  const cssW = mm.clientWidth, cssH = mm.clientHeight; if (cssW < 4 || cssH < 4) return;
  const bw = Math.max(8, Math.min(2000, Math.round(cssW*PLAN_SS)));

// Move the "you are here" arrow + floor label (DOM overlay, follows the camera every frame).
function updateMinimapOverlay(){
  const s = floors[activeFloor]; if (!s) return;
  mmLabel.textContent = s.name || '';
  const W = mm.clientWidth, H = mm.clientHeight;
  let px = W/2 + (cam.pos[0]-planCx)*planScale;   // world +X -> screen right
  let py = H/2 + (cam.pos[2]-planCz)*planScale;   // world +Z -> screen down (north-up)
  px = Math.max(7, Math.min(W-7, px)); py = Math.max(7, Math.min(H-7, py));
  mmCam.style.left = px+'px'; mmCam.style.top = py+'px';

function renderMinimap(){

function setMinimap(on){
  mmEnabled = !!on; mm.style.display = mmEnabled ? 'block' : 'none';

    activeFloor = pickFloor(); markPlanDirty(); }

// Resize grip (top-right): grow up + right from the fixed bottom-left anchor, keeping the aspect.
(function(){ let drag = null;
  mmGrip.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation();
    drag = { x:e.clientX, y:e.clientY, w:mm.clientWidth, h:mm.clientHeight }; });
  window.addEventListener('mousemove', e => { if (!drag) return;
    const asp = drag.w/drag.h, dx = e.clientX-drag.x, dy = drag.y-e.clientY;   // up = larger
    let w = drag.w + Math.max(dx, dy*asp);
    w = Math.max(160, Math.min(w, Math.min(window.innerWidth*0.6, window.innerHeight*0.6)));
    mm.style.width = w+'px'; mm.style.height = (w/asp)+'px'; markPlanDirty(); });
  window.addEventListener('mouseup', () => { drag = null; });
})();
window.__mm = () => ({ enabled:mmEnabled, floors:floors.map(f=>({name:f.name,baseY:f.baseY,topY:f.topY})),
  active:activeFloor, dirty:planDirty });
// debug (headless preview throttles rAF): drive one full frame on demand, and let a test
// place the camera at a chosen height/heading so the active floor + marker can be checked.
window.__mmStep = (t) => { frame(t || (window.performance ? performance.now() : 0)); };
window.__mmSetCam = (x,y,z,yaw) => { cam.pos=[x,y,z]; if(yaw!==undefined) cam.yaw=yaw; flying=false; };

// ---------- loop ----------
// Adaptive resolution: cap the drawing-buffer pixel count so a very large surface (popped out +
// full screen, or a high-DPI display) doesn't render at the full device pixel ratio and drop
// frames. Normal/docked windows keep full dpr, so there's NO visible change there; only oversized
// surfaces scale back toward native. Floor 1.0 means it never renders below native -> never soft,
// it just stops paying for 2x oversampling that a big screen doesn't benefit from. Heavy models
// stay pinned at 1.0 (the existing GPU-safety floor).
// Optional performance mode (user toggle, OFF by default): render a touch BELOW native and let
// the GPU upscale to the window. Kept gentle on purpose -- 0.85 of native is ~28% fewer fragments
// for a real frame-rate bump, with only a slight softening. This is the safe smoothness lever for
// the popped-out full-screen view (no WebView2 / init risk -- it's purely our render scale).
let perfMode = false;
const PERF_SCALE = 0.85;
function fitPixelRatio(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  // base: never below native, capped so big/high-DPI surfaces don't oversample; heavy models = 1.0.
  let pr = bigModel ? 1.0 : Math.max(1.0, Math.min(dpr, Math.sqrt(3.5e6 / (w * h))));
  if (perfMode) pr *= PERF_SCALE;            // gentle sub-native scale -> smoother, barely softer
  return pr;
}
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const pr = fitPixelRatio();
  const dw = Math.max(1, Math.round(w * pr)), dh = Math.max(1, Math.round(h * pr));
  // Compare the TARGET drawing-buffer size to the canvas's actual one. The old guard compared
  // canvas.width (drawing-buffer px) to w (CSS px); at dpr>1 those never matched, so setSize +
  // composer.setSize ran EVERY frame. Now it fires only on a real size or pixel-ratio change.
  if (canvas.width === dw && canvas.height === dh) return;
  if (renderer.getPixelRatio() !== pr) renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
function frame(t){
  requestAnimationFrame(frame);
  if (glLost) return;   // context is dead; don't throw on every frame trying to draw
  const dt = prevT ? Math.min(0.05, (t-prevT)/1000) : 0.016; prevT=t;
  const pads = navigator.getGamepads ? navigator.getGamepads() : []; let gp=null;
  for (const p of pads){ if (p){ gp=p; break; } }
  if (gp){ const dz=v=>Math.abs(v)<0.16?0:v; cam.yaw+=dz(gp.axes[2]||0)*2.4*dt; cam.pitch-=dz(gp.axes[3]||0)*2.4*dt;

  applyMovement(dt, gp);

  updateClip();
  applyCameraToThree();
  positionSkyObjects();   // centre stars/sun on the camera, inside the current far plane
  reportCam(t);

  else renderer.render(scene, camera);

}
showHint('Ready. Export & load a model to begin.');
requestAnimationFrame(frame);

const STANDALONE = !(window.chrome && window.chrome.webview);
const shareState = { clashes: [], viewpoints: [], project: 'Model' };
let shareBuilt = false;

function shareToggleCard(card){ card.classList.toggle('collapsed');
  const c = card.querySelector('.caret'); if (c) c.textContent = card.classList.contains('collapsed') ? '▶' : '▼'; }

function shareCard(title, bodyHtml, collapsed){
  return '<div class="card' + (collapsed ? ' collapsed' : '') + '">'
       + '<div class="sh">' + shareEsc(title) + '<span class="caret">' + (collapsed ? '▶' : '▼') + '</span></div>'
       + '<div class="bd">' + bodyHtml + '</div></div>';
}

function shareBuildShell(){
  const tgl = document.createElement('button');
  tgl.id = 'share_toggle'; tgl.className = 'show'; tgl.textContent = 'Clashes ◀';
  document.body.appendChild(tgl);

  const panel = document.createElement('div');
  panel.id = 'share'; panel.className = 'open';
  panel.innerHTML =
    '<div id="share_hd"><span class="ttl">' + shareEsc(shareState.project) + '</span>'
      + '<span class="wm"><span class="a">db</span><span class="d"> | </span><span class="a">HMS</span></span></div>'
    + '<div id="share_body">'
      + shareCard('How to move', '<div class="help">'
          + 'Drag to look around.<br>W A S D to move, Q / E down / up.<br>'
          + 'Press F for mouse-look fly (Esc to release).<br>Scroll to change speed. Click a clash below to fly to it.'
          + '</div>'
          + '<label class="ck" style="margin-top:8px"><input type="checkbox" id="share_minimap" checked> '
          + 'Show floor-plan minimap</label>', true)
      + shareCard('Clashes',
          '<input type="text" id="share_search" placeholder="Search clashes...">'
          + '<div class="help" style="margin-bottom:4px">Trade</div><div class="chips" id="share_trades"></div>'
          + '<div class="help" style="margin-bottom:4px">Status</div><div class="chips" id="share_status"></div>'
          + '<label class="ck" style="margin:4px 0"><input type="checkbox" id="share_markers"> Show markers in 3D</label>'
          + '<div class="cnt" id="share_cnt"></div><div class="clist" id="share_clist"></div>', false)
      + '<div id="share_views_sec">' + shareCard('Saved views', '<div id="share_views"></div>', false) + '</div>'
      + shareCard('Show / hide', '<div class="help" style="margin-bottom:6px">Turn models or categories off to declutter.</div>'
          + '<div id="share_vis"><div class="help">Loading model…</div></div>', true)
    + '</div>';
  document.body.appendChild(panel);

  tgl.onclick = () => { const open = panel.classList.toggle('open');
    tgl.textContent = open ? 'Clashes ▶' : 'Clashes ◀'; };
  // collapse/expand each card by clicking its header
  panel.querySelectorAll('.card .sh').forEach(sh => { sh.onclick = () => shareToggleCard(sh.parentNode); });
  document.getElementById('share_search').addEventListener('input', shareApply);
  document.getElementById('share_markers').addEventListener('change', shareApply);
  document.getElementById('share_minimap').addEventListener('change', e => setMinimap(e.target.checked));
}

// Post-load: the model is parsed (so floors/categories are known). Fill the
// show/hide tree and switch the floor-plan minimap on if its toggle is checked
// (setMinimap builds the floors lazily, which needs the loaded geometry).
function shareOnModelLoaded(models){
  shareFillVisibility(models);
  const mm = document.getElementById('share_minimap');
  if (mm) setMinimap(mm.checked);
}

function shareCheckedSet(containerId){
  const set = new Set();
  document.querySelectorAll('#' + containerId + ' input[type=checkbox]').forEach(c => { if (c.checked) set.add(c.value); });
  return set;
}

function shareFillChips(containerId, values){
  const box = document.getElementById(containerId);
  box.innerHTML = values.map(v =>
    '<label class="ck"><input type="checkbox" value="' + shareEsc(v) + '" checked> '
    + shareEsc(v === '-' ? 'Unassigned' : v) + '</label>').join('');
  box.querySelectorAll('input').forEach(c => c.addEventListener('change', shareApply));
}

function shareFillClashFilters(){
  const trades = [], statuses = [], ts = new Set(), ss = new Set();
  for (const c of shareState.clashes){
    if (c.trade && !ts.has(c.trade)){ ts.add(c.trade); trades.push(c.trade); }
    if (c.status && !ss.has(c.status)){ ss.add(c.status); statuses.push(c.status); }
  }
  shareFillChips('share_trades', trades.sort());
  shareFillChips('share_status', statuses.sort());
}

function shareFiltered(){
  const tr = shareCheckedSet('share_trades'), st = shareCheckedSet('share_status');
  const q = (document.getElementById('share_search').value || '').toLowerCase().trim();
  return shareState.clashes.filter(c =>
    (!c.trade || tr.has(c.trade)) && (!c.status || st.has(c.status))
    && (!q || (c.haystack || '').indexOf(q) >= 0));
}

function shareApply(){
  if (!shareBuilt) return;
  const rows = shareFiltered();
  const list = document.getElementById('share_clist'); list.innerHTML = '';
  const CAP = 1000;
  rows.slice(0, CAP).forEach(c => {
    const b = document.createElement('button'); b.className = 'crow'; b.textContent = c.label;
    b.onclick = () => { if (c.point) flyToPoint(c.point); };
    list.appendChild(b);
  });
  const cnt = document.getElementById('share_cnt');
  cnt.textContent = (rows.length > CAP ? 'Showing first ' + CAP + ' of ' + rows.length : 'Showing ' + rows.length)
                  + ' of ' + shareState.clashes.length + ' clashes';
  if (document.getElementById('share_markers').checked){
    setClashMarkers(rows.map(r => r.point).filter(Boolean)); showMarkers = true;
  } else { showMarkers = false; }
  applyMarkerVisibility();
}

function shareFillViewpoints(){
  const sec = document.getElementById('share_views_sec'), box = document.getElementById('share_views');
  const vps = shareState.viewpoints || [];
  if (!vps.length){ sec.style.display = 'none'; return; }
  box.innerHTML = '';
  vps.forEach(vp => {
    const b = document.createElement('button'); b.className = 'vbtn'; b.textContent = vp.name || 'View';
    b.onclick = () => { if (vp.pos) startFly(vp.pos, vp.yaw, vp.pitch); };
    box.appendChild(b);
  });
}

function shareFillVisibility(models){
  if (!shareBuilt) return;
  const box = document.getElementById('share_vis'); box.innerHTML = '';
  (models || []).forEach(m => {
    const mrow = document.createElement('label'); mrow.className = 'ck mrow';
    const mc = document.createElement('input'); mc.type = 'checkbox'; mc.checked = true;
    mc.onchange = () => { if (mc.checked) delete hiddenModel[m.name]; else hiddenModel[m.name] = true; recomputeVisibility(); };
    const ms = document.createElement('span'); ms.style.fontWeight = '600'; ms.textContent = m.name;
    mrow.appendChild(mc); mrow.appendChild(ms); box.appendChild(mrow);
    if (m.categories && m.categories.length){
      const cats = document.createElement('div'); cats.className = 'cats';
      m.categories.forEach(cat => {
        const key = m.name + '||' + cat;
        const cr = document.createElement('label'); cr.className = 'ck';
        const cc = document.createElement('input'); cc.type = 'checkbox'; cc.checked = true;
        cc.onchange = () => { if (cc.checked) delete hiddenCat[key]; else hiddenCat[key] = true; recomputeVisibility(); };
        const cs = document.createElement('span'); cs.textContent = cat;
        cr.appendChild(cc); cr.appendChild(cs); cats.appendChild(cr);
      });
      box.appendChild(cats);
    }
  });
}

function bootStandalone(){
  const b = window.__DBHMS_BUNDLE || {};
  shareState.clashes = b.clashes || [];
  shareState.viewpoints = b.viewpoints || [];
  shareState.project = b.project || 'Model';
  document.title = shareState.project + ' — dbHMS 3D Viewer';
  const min = document.getElementById('minbtn'); if (min) min.style.display = 'none';
  shareBuildShell(); shareBuilt = true;
  shareFillClashFilters(); shareApply(); shareFillViewpoints();
  const mb = window.__DBHMS_MODEL_B64;
  if (mb){ try { loadFromBuffer(b64ToBuffer(mb)); } catch(e){ showHint('Could not load the embedded model: ' + (e && e.message ? e.message : e)); } }
  else { showHint('This file has no embedded model.'); }
}

if (STANDALONE) bootStandalone();
</script>
</body>
</html>
