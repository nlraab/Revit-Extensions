<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbHMS 3D Viewer (three.js)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a3340; }
  #c { width: 100vw; height: 100vh; display: block; outline: none; }
  #badge { position: fixed; left: 10px; bottom: 34px; font: 700 13px Segoe UI, sans-serif;
           background: rgba(20,26,33,0.55); padding: 2px 8px; border-radius: 4px;
           user-select: none; pointer-events: none; }
  #minbtn { position: fixed; left: 10px; bottom: 8px; font: 600 11px Segoe UI, sans-serif;
            color: #9fb4c8; background: rgba(20,26,33,0.40); padding: 3px 10px; border-radius: 4px;
            border: 1px solid rgba(159,180,200,0.22); cursor: pointer; user-select: none; }
  #minbtn:hover { background: rgba(20,26,33,0.78); color: #cbd5e0; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
          font: 14px Segoe UI, sans-serif; color: #cbd5e0; text-align: center; pointer-events: none; }
  #props { position: fixed; display: none; max-width: 300px; background: rgba(255,255,255,0.97);
           border: 1px solid #cbd5e0; border-radius: 4px; padding: 6px 12px; font: 12px Segoe UI, sans-serif;
           box-shadow: 0 3px 10px rgba(0,0,0,0.30); z-index: 10; pointer-events: none; }
  #props .t { font-weight: 700; color: #1A202C; margin-bottom: 4px; }
  #props .r { color: #4A5568; line-height: 1.5; }
  #props .r b { color: #2D3748; font-weight: 600; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/three.module.js",
  "three/addons/": "./lib/three/addons/",
  "three/examples/jsm/": "./lib/three/addons/",
  "postprocessing": "./lib/three/addons/n8ao_pp_stub.js"
} }
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="badge"><span style="color:#00BFFF">db</span><span style="color:#7A8FA6"> | </span><span style="color:#00BFFF">HMS</span></div>
<div id="minbtn" title="Exit the enlarged view">minimize</div>
<div id="hint">Loading viewer…</div>
<div id="props"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
// N8AO: a more robust ambient-occlusion pass than three.js GTAO (which renders black on
// some NVIDIA/ANGLE/Direct3D drivers). N8AOPass REPLACES RenderPass -- it renders the
// scene AND applies AO in one pass. Vendored offline under lib/three/addons/.
import { N8AOPass } from 'three/addons/postprocessing/N8AO.js';

const canvas = document.getElementById('c');
const hint = document.getElementById('hint');
const props = document.getElementById('props');
let _hintTimer = null;
function showHint(t, fadeMs) {
  hint.textContent = t || ''; hint.style.display = t ? 'block' : 'none';
  if (_hintTimer) { clearTimeout(_hintTimer); _hintTimer = null; }
  // optional auto-dismiss so an informational notice doesn't sit over the model forever
  if (t && fadeMs) _hintTimer = setTimeout(() => { hint.style.display = 'none'; }, fadeMs);
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- renderer ----------
// NOTE: no logarithmicDepthBuffer — it's incompatible with GTAO ambient
// occlusion (and other depth-based post). Z-fighting is handled instead by
// robust bounds + tight camera-fit near/far, and (at the source) by the
// CustomExporter rebuild which won't emit Revit's coincident internal faces.
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Neutral (Khronos PBR-neutral) tone mapping: preserves material colour + contrast while
// still rolling highlights off. ACES blew out the exterior; AgX fixed that but desaturated
// everything to a flat grey (uniform in + out -- the "very grey/washed" look). Neutral keeps
// hues accurate (closer to Revit's Realistic) without the blowout. Exposure back to 1.0.
renderer.toneMapping = THREE.NeutralToneMapping;
// 1.3: the double-sRGB bug used to brighten Realistic; with that fixed, both paths render at
// the correct (darker) level, so lift exposure back up for a bright-but-not-washed interior.
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// WebGL context loss: a too-heavy model can trip Windows' GPU watchdog (TDR) or
// exhaust VRAM (esp. with Revit also holding the GPU) -- the context dies and the
// screen goes blank with no error. Catch it: report, stop hammering a dead context,
// and tell the user WHY instead of a silent blank-blue screen.
let glLost = false;
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true;
  try { post('diag:CONTEXT LOST (GPU reset -- model too heavy / out of GPU memory)'); } catch(_e){}
  try { showHint('Graphics reset. The model is too heavy for the GPU right now. Close and reopen '
    + 'the 3D Viewer to recover. If it keeps happening, reboot the PC, or use a smaller export scope.'); } catch(_e){}
}, false);
// A lost context destroys EVERY GPU resource (textures, buffers, shaders, render targets).
// Resuming in place (the old glLost=false) rendered garbage -- the boxed/corner image. So we
// stay down and tell the user to relaunch; a fresh page reinitialises the GPU cleanly. Do NOT
// auto-resume here.
renderer.domElement.addEventListener('webglcontextrestored', () => {
  try { post('diag:context restored (relaunch the viewer for a clean state)'); } catch(_e){} }, false);

const scene = new THREE.Scene();
const SLATE = new THREE.Color(0x2a3340);
const pmrem = new THREE.PMREMGenerator(renderer);

// Procedural gradient sky: zenith blue -> bright horizon -> warm ground. Drives
// BOTH image-based lighting (the outdoor ambient that makes PBR materials read as
// their real material) AND the visible background. A full physically-based sky
// with a movable sun + time-of-day is the Environment phase; this is its base.
function _rgb(a){ return 'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')'; }
function _mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
// Build an equirect sky with a movable sun. `s` = unit direction TOWARD the sun (Y-up).
// Sky warms + dims as the sun nears/drops below the horizon; a glowing sun disc is drawn
// at the sun's position, matched to three.js's equirect mapping so it lines up with the
// light direction (and the shadows it casts).
function buildSky(s){
  const W=512, H=256, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const elDeg = Math.asin(Math.max(-1,Math.min(1,s.y))) * 180/Math.PI;   // sun elevation, degrees
  const d = Math.max(0, Math.min(1, (elDeg + 4)/30));    // daylight: 0 = night (sun below ~-4), 1 = high sun
  // subtle warm band only when the sun is low but up (peaks ~4deg, gone by ~20deg / below horizon)
  const warm = Math.max(0, Math.min(1, 1 - Math.abs(elDeg - 4)/16)) * Math.min(1, d*1.6);
  const zenith  = _mix([10,12,24],  [95,150,220], d);    // dark night-blue -> day blue
  let   horizon = _mix([22,24,36],  [205,222,240], d);   // dark -> pale day haze
  horizon       = _mix(horizon, [232,170,118], warm*0.5);// gentle sunset tint (much less orange)
  const ground  = _mix([16,15,14],  [118,112,103], 0.22+0.78*d);
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0.00, _rgb(zenith));
  grad.addColorStop(0.46, _rgb(_mix(zenith,horizon,0.82)));
  grad.addColorStop(0.50, _rgb(horizon));
  grad.addColorStop(0.54, _rgb(_mix(horizon,ground,0.6)));
  grad.addColorStop(1.00, _rgb(ground));
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  if (s.y > -0.07){   // draw the sun only while it's at/above the horizon
    const u = Math.atan2(s.z, s.x)/(2*Math.PI) + 0.5;
    const v = Math.asin(Math.max(-1,Math.min(1,s.y)))/Math.PI + 0.5;
    const sx = u*W, sy = (1-v)*H;                  // (1-v): CanvasTexture flips Y
    const col = elDeg < 16 ? '255,200,140' : '255,250,236';   // warm near the horizon
    g.globalCompositeOperation = 'lighter';
    for (const ox of [-W, 0, W]){                  // wrap the glow across the seam
      const gr = g.createRadialGradient(sx+ox, sy, 0, sx+ox, sy, W*0.16);
      gr.addColorStop(0.00, 'rgba('+col+',1)');
      gr.addColorStop(0.045,'rgba('+col+',0.95)');
      gr.addColorStop(0.30, 'rgba('+col+',0.14)');
      gr.addColorStop(1.00, 'rgba('+col+',0)');
      g.fillStyle = gr; g.fillRect(0,0,W,H);
    }
    g.globalCompositeOperation = 'source-over';
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping; tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
// sun state (azimuth + elevation in degrees, strength 0..1). Driven by the panel's
// Time of day / Sun direction / Sun strength controls via the 'sun' message.
let sunAz = 135, sunEl = 55, sunStrength = 0.7;
function sunDir(){ const a=sunAz*Math.PI/180, e=sunEl*Math.PI/180, c=Math.cos(e);
  return new THREE.Vector3(c*Math.cos(a), Math.sin(e), c*Math.sin(a)); }
let skyTex = buildSky(sunDir());
let envTex = pmrem.fromEquirectangular(skyTex).texture;
scene.environment = envTex;
// Full sky-ambient (1.0). It was dropped to 0.7 to fight a "washed out" look that turned
// out to be the double-sRGB composer bug (since fixed) -- so that reduction was a wrong
// guess that under-lit deep interior surfaces (a CMU wall reading near-black even though
// its texture + factor are correct). Back to full strength so interiors are properly lit.
scene.environmentIntensity = 1.0;
scene.background = skyTex;
let envDropped = false;   // set true if env IBL is found broken on this GPU (see verifyRender)
let bigModel = false;     // set per-load: huge models render lean (no shadow/AO) to avoid context loss
let bigModelTris = '0';   // millions, for the on-screen hint
// Interior reflection probe: a cubemap captured once inside the model. Reflective surfaces
// (glass + shiny floors) reflect THIS (the room) instead of only the sky, while matte surfaces
// keep the sky as their ambient -- so the lighting is unchanged. A single static probe is an
// approximation (one viewpoint for the whole model), good enough to read as "interior reflection".
let reflectiveMats = new Set();   // materials that should get the room probe as their envMap
let roomEnv = null, reflRT = null, reflCam = null;
// toggle sky vs flat slate (Draft uses slate + no IBL for a fast clay look)
function setSky(on){ scene.background = on ? skyTex : SLATE; scene.environment = (on && !envDropped) ? envTex : null;
  if (typeof ground !== 'undefined' && ground) ground.visible = on && !!bounds; }
// rebuild the sky + image-based lighting for the current sun, and re-tint the sun light
// (its DIRECTION is applied every frame in updateClip from sunDir()).
function applySun(){
  const onSky = (scene.background !== SLATE);
  const old = skyTex; skyTex = buildSky(sunDir()); if (old) old.dispose();
  const oldEnv = envTex; envTex = pmrem.fromEquirectangular(skyTex).texture; if (oldEnv) oldEnv.dispose();
  if (onSky) scene.background = skyTex;
  if (!envDropped && scene.environment) scene.environment = envTex;
  // sun fades out as it drops below the horizon (no lighting the model from beneath at night)
  const above = Math.max(0, Math.min(1, (sunEl + 2) / 12));
  // Sun dominates the ambient fill so lit vs shadowed faces clearly differ (the
  // contrast a flat sky-flooded wall lacks). AgX rolls the brighter lit faces off
  // gracefully, so this adds punch without blowing them to white.
  sun.intensity = (0.8 + 4.6*Math.max(0, Math.min(1, sunStrength))) * above;
  sun.color.setRGB(1.0, sunEl < 18 ? 0.85 : 0.95, sunEl < 18 ? 0.72 : 0.90);  // warmer when low
}

const sun = new THREE.DirectionalLight(0xfff2e0, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);   // 2048 keeps GPU memory modest (4096 + the
sun.shadow.bias = -0.0004;            // half-float AO composer can exhaust some GPUs)
sun.shadow.normalBias = 0.04;
sun.shadow.radius = 3;                 // soft (PCF) shadow edges
scene.add(sun, sun.target);
// sky/ground ambient. Forward-lit (no half-float), so it always works -- if the
// image-based env lighting turns out broken on a GPU, we drop the env and lean
// on a brighter version of this.
const hemi = new THREE.HemisphereLight(0xbcd0e6, 0x6b6256, 0.45);   // interior fill so deep
scene.add(hemi);                                                     // (sunless) walls aren't black

// ---- ground plane -----------------------------------------------------------
// The building was floating in the bright sky with nothing under it -- a big part
// of the "washed out" read. A large matte ground catches the sun's shadow (a real
// contact shadow grounds the building and adds the contrast a flat white wall lacks)
// and gives the silhouette something other than pale sky to sit against. It's NOT a
// model element: added straight to the scene (not `root`), so it stays out of
// selection, visibility, bounds and the element list.
const groundMat = new THREE.MeshStandardMaterial({ color: 0x9298a0, roughness: 0.98, metalness: 0.0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), groundMat);
ground.rotation.x = -Math.PI / 2;     // lay flat on XZ, +Y up
ground.receiveShadow = true;
ground.castShadow = false;
ground.visible = false;               // shown once a model is placed (and only on sky modes)
ground.userData.__env = true;
scene.add(ground);
function placeGround(){
  if (!bounds) return;
  const span = Math.max(bounds.span || bounds.radius * 2, 4);
  ground.scale.set(span * 12, span * 12, 1);   // reads as "the ground", covers the shadow frustum
  const y = (bounds.minY !== undefined ? bounds.minY : bounds.center.y - bounds.radius) - span * 0.001;
  ground.position.set(bounds.center.x, y, bounds.center.z);
  ground.visible = (scene.background !== SLATE);   // hidden in Draft's flat-slate clay mode
}

const camera = new THREE.PerspectiveCamera(60, 2, 0.05, 50000);

// ---------- post-processing: ambient occlusion (GTAO) ----------
// AO is the single biggest "looks rendered" cue (soft darkening in corners and
// where elements meet). Composited through EffectComposer; OutputPass does the
// tone map + sRGB. Toggled by quality tier (off in Draft).
// On this stack (NVIDIA RTX via ANGLE/Direct3D11, dpr 1.5) the composer renders FINE
// to an offscreen 8-bit target but draws BLACK when it writes directly to the screen
// (default framebuffer); a plain renderer.render() to the screen is always fine. So we
// render the composer to an OFFSCREEN 8-bit target and then copy that target to the
// screen with a plain fullscreen-quad pass -- a composite of two operations we've each
// proven work, sidestepping the broken composer->screen write entirely.
const _composerRT = new THREE.WebGLRenderTarget(
  Math.max(2, renderer.domElement.width), Math.max(2, renderer.domElement.height),
  { type: THREE.UnsignedByteType });   // 8-bit, NO multisample (MSAA-resolve is a suspect on ANGLE/NVIDIA)
const composer = new EffectComposer(renderer, _composerRT);
composer.renderToScreen = false;            // never write to the screen directly
// N8AOPass renders the scene AND applies ambient occlusion (it replaces RenderPass).
const n8ao = new N8AOPass(scene, camera,
  Math.max(2, renderer.domElement.width), Math.max(2, renderer.domElement.height));
try {
  n8ao.setQualityMode('Medium');            // good/cheap; we drop to Low on weak GPUs later
  n8ao.configuration.aoRadius = 1.5;        // metres; contact shading in corners/where things meet
  n8ao.configuration.distanceFalloff = 1.0;
  n8ao.configuration.intensity = 3.0;       // AO strength
  n8ao.configuration.halfRes = false;       // full-res avoids the sky-darkening half-res issue
} catch(e){}
composer.addPass(n8ao);
// NO OutputPass: N8AOPass already outputs a finished image (scene + AO + tone mapping +
// sRGB). Adding OutputPass applied a SECOND sRGB encode, which lifted the midtones and made
// Realistic look brighter/washed than Shaded (measured: composer mean ~= plain^(1/2.2)).
// With it gone, the composer (Realistic) matches the plain (Shaded) render plus the AO.

// fullscreen-quad blit of the composer's (already display-ready, sRGB) output texture
// straight to the screen. RawShaderMaterial = no extra color conversion (1:1 copy).
const _blitScene = new THREE.Scene();
const _blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const _blitMat = new THREE.RawShaderMaterial({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'attribute vec3 position; attribute vec2 uv; varying vec2 vUv;' +
                'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'precision highp float; uniform sampler2D tDiffuse; varying vec2 vUv;' +
                  'void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }',
  depthTest: false, depthWrite: false
});
_blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), _blitMat));
function blitComposerToScreen(){
  _blitMat.uniforms.tDiffuse.value = composer.readBuffer.texture;   // OutputPass result
  renderer.setRenderTarget(null);
  renderer.render(_blitScene, _blitCam);
}
let aoEnabled = true;
// Some GPUs/drivers (seen in Revit's WebView2/ANGLE) choke on the half-float
// textures used by image-based env lighting and the AO composer, rendering the
// GEOMETRY pitch-black while the sky stays fine. verifyRender() runs once after a
// model loads and self-heals: (1) if removing the env map makes the scene BRIGHTER,
// the env IBL is broken here -> drop it + brighten the plain sky/sun lighting;
// (2) if the AO composer is black while the plain render is lit -> turn AO off.
// Conservative thresholds: on a healthy GPU neither triggers. Never worse than a
// plain lit render.
// composerOK starts FALSE: Realistic renders via the plain lit path (always works)
// until verifyRender PROVES the AO composer draws to screen without blacking the
// geometry. So the worst case is a lit Realistic without AO -- never a black model.
let composerOK = false, renderChecked = false;
// center sampling region (middle ~36% of the canvas, where the framed model sits)
function _region(){ const w=renderer.domElement.width, h=renderer.domElement.height;
  return { w, h, rx:Math.floor(w*0.32), ry:Math.floor(h*0.32), rw:Math.max(8,Math.floor(w*0.36)), rh:Math.max(8,Math.floor(h*0.36)) }; }
// fraction of near-black pixels in the center from a fresh DIRECT (RGBA8) render.
// Measures the actual symptom (pitch-black geometry) directly, so the bright sky
// can't dilute it the way an average would.
function _directBlackFrac(){
  const R = _region(); const prevRT = renderer.getRenderTarget();
  const tmp = new THREE.WebGLRenderTarget(R.w, R.h);
  renderer.setRenderTarget(tmp); renderer.clear(); renderer.render(scene, camera);
  const px = new Uint8Array(R.rw*R.rh*4); renderer.readRenderTargetPixels(tmp, R.rx, R.ry, R.rw, R.rh, px);
  renderer.setRenderTarget(prevRT); tmp.dispose();
  let black=0, n=R.rw*R.rh; for (let i=0;i<px.length;i+=4){ if (px[i]+px[i+1]+px[i+2] < 16) black++; }
  return black/n;
}
// fraction of near-black pixels in the center of the ACTUAL canvas (default
// framebuffer). preserveDrawingBuffer keeps it readable. Unlike reading a composer
// buffer, this reflects EXACTLY what's on screen -- the composer can render fine to
// an offscreen buffer yet draw black to the screen on some GPUs (the real symptom).
function _screenBlackFrac(){
  const gl = renderer.getContext(), R = _region();
  renderer.setRenderTarget(null);
  const px = new Uint8Array(R.rw*R.rh*4);
  gl.readPixels(R.rx, R.ry, R.rw, R.rh, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let black=0, n=R.rw*R.rh; for (let i=0;i<px.length;i+=4){ if (px[i]+px[i+1]+px[i+2] < 16) black++; }
  return black/n;
}
// report the ACTUAL GPU/renderer + key WebGL capabilities, so we can tell whether
// WebView2 is on the real GPU or fell back to software (SwiftShader), and whether
// float render targets (used by the AO composer) are even supported here.
function gpuInfo(){
  try {
    const gl = renderer.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const rend = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    const vend = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    post('diag:gpu renderer="' + rend + '" vendor="' + vend + '"' +
         ' ver="' + gl.getParameter(gl.VERSION) + '"' +
         ' colorBufFloat=' + !!gl.getExtension('EXT_color_buffer_float') +
         ' colorBufHalfFloat=' + !!gl.getExtension('EXT_color_buffer_half_float') +
         ' maxTex=' + gl.getParameter(gl.MAX_TEXTURE_SIZE) +
         ' dpr=' + (window.devicePixelRatio || 1));
  } catch(e){ try { post('diag:gpu error ' + (e&&e.message?e.message:e)); } catch(_e){} }
}
function verifyRender(){
  if (!root || renderChecked) return;
  const w = renderer.domElement.width, h = renderer.domElement.height;
  if (w < 16 || h < 16) return;   // wait for a real canvas size
  renderChecked = true;
  gpuInfo();
  const _gl = renderer.getContext();
  if (glLost || (_gl.isContextLost && _gl.isContextLost())){
    try { post('diag:render-check skipped (context lost)'); } catch(_e){} return;
  }
  try {
    // --- env-lighting check: does the env map blacken the geometry on this GPU? ---
    const blackOn = _directBlackFrac();           // with env IBL on
    const savedEnv = scene.environment;
    scene.environment = null;
    const blackOff = _directBlackFrac();           // with env IBL off
    if (blackOn > 0.12 && (blackOn - blackOff) > 0.08){
      // a big black region with the env on that disappears without it -> env IBL is broken here
      envDropped = true; hemi.intensity = 0.75;    // keep env off, brighten the plain sky/sun ambient
      post('diag:env fallback(env IBL blacks geometry) blackOn=' + blackOn.toFixed(2) + ' blackOff=' + blackOff.toFixed(2));
    } else {
      scene.environment = savedEnv;                // env is fine; keep it
      post('diag:env ok blackOn=' + blackOn.toFixed(2) + ' blackOff=' + blackOff.toFixed(2));
    }
    // --- 4-way probe: isolate exactly which stage goes black on THIS GPU ---
    // plainScreen : plain render -> screen           (known-good baseline)
    // plainRT     : plain render -> 8-bit offscreen RT (does render-to-target work at all?)
    // composerRT  : full composer -> its offscreen buffer (does the post pipeline work offscreen?)
    // composerScr : composer offscreen + blit -> screen (the path Realistic uses)
    const cw = renderer.domElement.width, ch = renderer.domElement.height;
    if (cw >= 200 && ch >= 120){
      const R = _region();
      function rtBlack(rt){ const px=new Uint8Array(R.rw*R.rh*4);
        renderer.readRenderTargetPixels(rt, R.rx, R.ry, R.rw, R.rh, px);
        let b=0,n=R.rw*R.rh; for(let i=0;i<px.length;i+=4){ if(px[i]+px[i+1]+px[i+2]<16)b++; } return b/n; }
      const prevRT = renderer.getRenderTarget();
      // plainRT: plain scene render into an 8-bit offscreen target
      const testRT = new THREE.WebGLRenderTarget(cw, ch, { type: THREE.UnsignedByteType });
      renderer.setRenderTarget(testRT); renderer.clear(); renderer.render(scene, camera);
      const plainRT = rtBlack(testRT);
      renderer.setRenderTarget(prevRT); testRT.dispose();
      // composerRT: the N8AO composer (scene + AO) into its own offscreen buffer
      composer.render();
      const composerRT = rtBlack(composer.readBuffer);
      // composerScr: blit that to the screen (the path Realistic uses)
      blitComposerToScreen();
      const composerScr = _screenBlackFrac();
      // plainScreen baseline
      renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
      const plainScreen = _screenBlackFrac();
      composerOK = (composerScr - plainScreen) < 0.10;
      post('diag:ao ' + (composerOK ? 'enabled(N8AO ok)' : 'disabled(N8AO black -> plain render)') +

    } else {
      post('diag:ao skipped(canvas ' + cw + 'x' + ch + ') -> staying on plain render');

}
function tuneAO(){

// ---------- free-fly camera (ported from the WebGL viewer) ----------
const cam = { pos: [0, 0, 0], yaw: 0, pitch: 0 };
let vel = [0, 0, 0], keys = {}, dragMode = null, rightLook = false, locked = false;
// true between requesting pointer-lock and it engaging: suppress hover-picking so a stray
// transition mousemove can't re-show the selection box right after F clears it.
let lockPending = false;
let lastX = 0, lastY = 0, prevT = 0;
let userSpeed = 4.0, userLook = 0.10;
const PITCH_LIMIT = Math.PI / 2 - 0.02;

// ---------- model state ----------
const loader = new GLTFLoader();
let root = null;                 // loaded glTF scene
let elements = [];               // [{obj, meta, model, category, workset, center, box, elemId, ...}]
let pickables = [];              // meshes for raycasting (small-model path only)
// Merged path (big models): per-element meshes are fused into a few large meshes by
// material to cut draw calls ~1000x, so the full shadow+AO pipeline can run without
// tripping the GPU. Selection then uses GPU picking (an offscreen id pass) and
// visibility a per-vertex _vis attribute, since there's no longer one object per
// element. Small models keep the proven per-object path untouched.
let merged = false;              // true once a model is rendered via the merged path
let mergedMeshes = [];           // the fused THREE.Mesh list
let mergedRoot = null;           // group holding mergedMeshes
let bounds = null;               // {center:THREE.Vector3, radius}
let assetExtras = {};
const hiddenModel = {}, hiddenCat = {}, hiddenWs = {};
const SEP = '||';
function catKey(e){ return e.model + SEP + e.category; }
function wsKey(e){ return e.model + SEP + e.workset; }

function disposeModel(){
  // interior reflection probe: drop the per-model reflective set + its env texture (the
  // cube RT + camera are reused across loads)
  reflectiveMats = new Set();
  if (roomEnv){ roomEnv.dispose(); roomEnv = null; }
  // merged meshes (big-model path): their geometry is ours, materials are shared with root
  if (mergedRoot){
    scene.remove(mergedRoot);
    for (const m of mergedMeshes){ if (m.geometry) m.geometry.dispose(); }
    mergedRoot = null;
  }
  mergedMeshes = []; merged = false;
  if (!root){ elements = []; pickables = []; clearSelection(); clearMarkers(); return; }
  scene.remove(root);
  root.traverse(o => { if (o.isMesh){ if (o.geometry) o.geometry.dispose(); if (o.material){ if (o.material.map) o.material.map.dispose(); o.material.dispose(); } } });
  root = null; elements = []; pickables = [];
  edgeLines = []; edgesBuilt = false;   // edge overlays were children of the meshes -> gone with root
  clearSelection(); clearMarkers();
}

// "Show edges" (Revit shaded-with-edges look): thin dark lines on sharp edges, built
// lazily on first enable as children of each mesh (so they inherit transform AND hide
// with the mesh's visibility). No post-processing -> works on any GPU.
let edgeLines = [], edgesBuilt = false, edgesOn = false;
const edgeMat = new THREE.LineBasicMaterial({ color: 0x2b3340, transparent: true, opacity: 0.5 });
function buildEdges(){
  if (edgesBuilt || !pickables.length) return;

  for (const p of pickables){
    try { const ls = new THREE.LineSegments(new THREE.EdgesGeometry(p.geometry, 30), edgeMat);
      ls.visible = edgesOn; ls.raycast = function(){}; p.add(ls); edgeLines.push(ls); } catch(e){}
  }
}
function setEdges(on){ edgesOn = on; if (on) buildEdges(); for (const l of edgeLines) l.visible = on; }

// Walk up from a hit mesh to the nearest ancestor carrying an element, and return
// its WRAPPER ({obj,meta,box,center,...}) -- the display code (showHover/
// setHighlight) needs .meta/.box, NOT the raw Object3D. Returning the object here
// was the selection bug: a hit threw on e.box/e.meta so nothing ever appeared.
function elementOf(obj){
  let o = obj;
  while (o){ if (o.userData && o.userData.__el) return o.userData.__el; o = o.parent; }
  return null;
}

function onLoaded(gltf){
  disposeModel();
  root = gltf.scene;
  assetExtras = (gltf.parser && gltf.parser.json.asset && gltf.parser.json.asset.extras) || {};
  const ctrs = [];
  root.traverse(o => {
    if (o.userData && o.userData.element_id !== undefined){
      const box = new THREE.Box3().setFromObject(o);
      const center = box.getCenter(new THREE.Vector3());
      const e = { obj: o, meta: o.userData, model: o.userData.model || 'Model',
                  category: o.userData.category || 'Other', workset: o.userData.workset || '',
                  center: center, box: box, elemId: elements.length };
      o.userData.__el = e;   // link object -> wrapper so a raycast hit resolves to it
      elements.push(e); ctrs.push(center);
    }
    if (o.isMesh){
      o.castShadow = true; o.receiveShadow = true;
      const mat = o.material;
      if (mat){
        mat.side = THREE.DoubleSide;
        mat.envMapIntensity = 1.1;      // let the sky show in the surface
        // Respect the real per-material metalness the exporter now carries
        // (clamp guards against bad data); older exports report 0 = dielectric.
        mat.metalness = (mat.metalness === undefined)
          ? 0.0 : Math.min(1.0, Math.max(0.0, mat.metalness));
        if (mat.transparent || (mat.opacity !== undefined && mat.opacity < 0.999)){
          // glass: clear + sharply reflective. Lower opacity reads as real glass, high
          // envMapIntensity makes the reflected room/sky pop (the interior probe makes this look
          // like glass reflecting the space rather than a flat tinted panel).
          mat.roughness = 0.05; mat.metalness = 0.0; mat.envMapIntensity = 3.8;
          if (mat.opacity < 0.28) mat.opacity = 0.28;
          reflectiveMats.add(mat);
        } else {
          // opaque: honour the real Revit finish (matte concrete vs glossy paint vs
          // metal) the exporter now ships, with a floor so default-matte surfaces
          // aren't dead-flat. Old exports default to 0.85 = matte, unchanged.
          const r = (mat.roughness === undefined) ? 0.85 : mat.roughness;
          mat.roughness = Math.min(1.0, Math.max(0.18, r));
          // Reflective ONLY when Revit's data says so: metal (its Material Class -> metalness)
          // OR a glossy finish (low roughness from Smoothness). Those get the room probe +
          // a boosted reflection; matte surfaces are never faked reflective.
          const isMetal = mat.metalness > 0.3;
          if (isMetal || mat.roughness < 0.35){
            mat.envMapIntensity = isMetal ? 3.4 : 3.0;
            reflectiveMats.add(mat);
          }
        }
        mat.needsUpdate = true;
      }
      pickables.push(o);
    }
  });
  computeBounds(ctrs);
  // Decide the render path BEFORE adding geometry to the scene. A big model (or a
  // forced test) takes the merged path: fuse by material so the full shadow+AO pipeline
  // can run, and never add the raw per-element scene. Small models add `root` as-is and
  // keep the proven per-object selection/visibility path untouched.
  const tris = countTris();
  bigModelTris = (tris / 1e6).toFixed(1);
  bigModel = tris > BIG_MODEL_TRIS;
  merged = (elements.length > 0) && (bigModel || window.__forceMerge === true);
  if (bigModel) applyBigModelMemory();   // trim GPU memory so a heavy model is less likely to reset it
  let usedLean = false;
  if (merged){
    try {
      buildMerged();
      // originals are baked into the merged meshes now; free the raw scene's geometry
      root.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
      renderer.setPixelRatio(bigModel ? 1.0 : Math.min(window.devicePixelRatio || 1, 2));
      post('diag:merged meshes=' + mergedMeshes.length + ' elements=' + elements.length +
           ' tris=' + Math.round(tris));
    } catch (err){
      // merge failed -> fall back to the raw scene in lean mode so it still shows
      merged = false; mergedMeshes = [];
      if (mergedRoot){ scene.remove(mergedRoot); mergedRoot = null; }
      scene.add(root); applyLean(); usedLean = true;
      window.__mergeErr = (err && err.stack) ? err.stack : String(err);
      post('diag:merge FAILED ' + (err && err.message ? err.message : err) + ' -> lean fallback');
    }
  } else {
    scene.add(root);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    post('diag:model tris=' + Math.round(tris));
  }
  placeGround();
  tuneAO();
  frameCamera();
  captureReflectionProbe();   // interior cubemap so glass/shiny surfaces reflect the room
  recomputeVisibility();
  reportFilters();
  showHint(usedLean ? ('Large model (' + bigModelTris + 'M triangles): lighter render for stability.')
           : (merged && bigModel ? ('Large model (' + bigModelTris + 'M triangles) merged for performance.') : ''),
           6000);
  // verify env + AO aren't black on this GPU (self-heals). Skip only the lean fallback
  // (AO is off there); the merged path runs the full pipeline, so it gets checked.
  if (!usedLean) setTimeout(verifyRender, 900);
}

// Heavy-model guard. A federated MEP model can be millions of triangles. The merged path
// handles that by cutting draw calls, but if merging is unavailable we fall back to a lean
// single-pass lit render (no shadow map, no AO, lower pixel ratio) so the model still shows
// instead of tripping the GPU watchdog (TDR)/VRAM -> lost context -> blank screen.
const BIG_MODEL_TRIS = 2500000;
function countTris(){
  let tris = 0;
  for (const e of elements){
    const g = e.obj && e.obj.geometry;
    if (g){ const idx = g.index;
      tris += idx ? idx.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0); }
  }
  return tris;
}
function applyLean(){
  renderer.setPixelRatio(1.0);
  renderer.shadowMap.enabled = false;
  scene.traverse(o => { if (o.isMesh){ o.castShadow = false; if (!o.userData.__env) o.receiveShadow = false; } });
  aoEnabled = false; composerOK = false; renderChecked = true;   // never run the AO path/probe
}
// Trim GPU memory for a heavy model so it's less likely to reset the driver. Geometry is the
// bulk (the real fix is compression), but a smaller shadow map is free + safe. (Pixel ratio is
// already forced to 1.0 for big models on the merged path.)
function applyBigModelMemory(){
  try {
    sun.shadow.mapSize.set(1024, 1024);                  // 2048 -> 1024 = 1/4 the shadow-map VRAM
    if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }   // recreate at new size
  } catch(e){}
}

// Choose the probe point: try a few candidates across the footprint (centre + corners,
// eye height) and pick the most OPEN one. A point stuck inside a solid captures a dark,
// near-uniform cube; an open point sees lit surfaces + sky-through-openings. Scoring by mean
// brightness (cheap 16px cube) auto-avoids the "probe ended up inside a wall" case without
// any geometry analysis -- so it stays robust across unknown models.
let scoreRT = null, scoreCam = null;
function _bestProbePoint(){
  const c = bounds.center, span = bounds.span || 10;
  const y = (bounds.minY !== undefined ? bounds.minY : c.y) + Math.min(2.0, span * 0.08);
  // INTERIOR: the model centre is open interior space -- it reflects the ROOM, not the sky.
  // Use it unless it's stuck inside solid geometry (a near-black capture), then nudge to a
  // nearby interior point. We deliberately do NOT pick the "brightest" candidate: brightest =
  // sees the most sky = OUTSIDE, which is the wrong thing to reflect (that was the regression).
  const o = span * 0.12;
  const cands = [ new THREE.Vector3(c.x, y, c.z),
                  new THREE.Vector3(c.x, y + span * 0.15, c.z),
                  new THREE.Vector3(c.x + o, y, c.z), new THREE.Vector3(c.x - o, y, c.z),
                  new THREE.Vector3(c.x, y, c.z + o), new THREE.Vector3(c.x, y, c.z - o) ];
  try {
    if (!scoreRT){ scoreRT = new THREE.WebGLCubeRenderTarget(16);
      scoreCam = new THREE.CubeCamera(0.1, 100000, scoreRT); scene.add(scoreCam); }
    const buf = new Uint8Array(16 * 16 * 4);
    for (const p of cands){
      scoreCam.position.copy(p); scoreCam.update(renderer, scene);
      let sum = 0, n = 0;
      for (let f = 0; f < 6; f++){
        renderer.readRenderTargetPixels(scoreRT, 0, 0, 16, 16, buf, f);
        for (let i = 0; i < buf.length; i += 4){ sum += (0.3*buf[i] + 0.6*buf[i+1] + 0.1*buf[i+2]) / 255; n++; }
      }
      if (sum / n > 0.03) return p.clone();   // first NON-stuck wins; centre is first -> interior
    }
    return cands[0];
  } catch(e){ return cands[0]; }   // scoring failed -> centre
}

// Capture the scene into a cubemap from an open point INSIDE the model, then make reflective
// materials reflect THAT (the room) instead of the sky. One-time, low-res, fully defensive:
// on any failure the surfaces just keep their sky reflection. The face renders are a brief
// one-off at load (cheap on the merged model); the cubemap itself is a few MB.
function captureReflectionProbe(){
  if (!reflectiveMats.size || !bounds) return;
  try {
    if (!reflRT){
      reflRT = new THREE.WebGLCubeRenderTarget(256);
      reflCam = new THREE.CubeCamera(0.1, 100000, reflRT);
      scene.add(reflCam);                                // invisible; just needs to be in the graph
    }
    const hl = hlBox ? hlBox.visible : false; if (hlBox) hlBox.visible = false;   // don't capture the highlight box
    const probePt = _bestProbePoint();
    reflCam.position.copy(probePt);
    reflCam.update(renderer, scene);
    if (hlBox) hlBox.visible = hl;
    const old = roomEnv;
    roomEnv = pmrem.fromCubemap(reflRT.texture).texture;   // roughness-aware reflections
    if (old) old.dispose();
    // aim the box-projection at the probe point + the model's box, so reflections are
    // parallax-correct (each surface reflects the room from ITS position, not the probe's)
    bpUniforms.bpProbePos.value.copy(probePt);
    bpUniforms.bpBoxMin.value.copy(bounds.boxMin);
    bpUniforms.bpBoxMax.value.copy(bounds.boxMax);
    reflectiveMats.forEach(m => {
      m.envMap = roomEnv;
      _injectMatShader(m, !!(m.userData && m.userData.__needsVis), true);   // vis (if merged) + box
    });
    post('diag:reflection probe captured (' + reflectiveMats.size + ' reflective materials, box-projected)');
  } catch(e){
    try { post('diag:reflection probe failed ' + (e && e.message ? e.message : e)); } catch(_e){}
  }
}

// Shared box-projection uniforms (the probe point + the room box). One set, referenced by
// every box-projected material, so updating these values re-aims all reflections at once.
const bpUniforms = { bpProbePos: { value: new THREE.Vector3() },
                     bpBoxMin:   { value: new THREE.Vector3() },
                     bpBoxMax:   { value: new THREE.Vector3() } };

// One onBeforeCompile per material doing whatever it needs (set ONCE -- a second assignment
// would clobber the first, so vis + box live together here):
//  doVis: a per-vertex _vis attribute that discards hidden fragments, so one merged mesh can
//    hide individual elements (a category/workset toggle) without re-splitting geometry.
//  doBox: box-project the reflection vector so a single interior cubemap reads correctly for
//    each surface's own position (parallax) -- glass panes across a wall then differ. Only the
//    specular reflection (getIBLRadiance) is remapped; diffuse ambient (getIBLIrradiance) is
//    untouched. Anchored on standard-material chunk strings reliably present in MeshStandardMaterial.
function _injectMatShader(mat, doVis, doBox){
  mat.onBeforeCompile = (shader) => {
    if (doVis){
      shader.vertexShader = 'attribute float _vis;\nvarying float vVis;\n' +
        shader.vertexShader.replace('#include <begin_vertex>',
                                    '#include <begin_vertex>\n  vVis = _vis;');
      shader.fragmentShader = 'varying float vVis;\n' +
        shader.fragmentShader.replace('#include <clipping_planes_fragment>',
                                      '#include <clipping_planes_fragment>\n  if (vVis < 0.5) discard;');
    }
    if (doBox){
      shader.uniforms.bpProbePos = bpUniforms.bpProbePos;
      shader.uniforms.bpBoxMin   = bpUniforms.bpBoxMin;
      shader.uniforms.bpBoxMax   = bpUniforms.bpBoxMax;
      shader.vertexShader = 'varying vec3 vWorldPosBP;\n' +
        shader.vertexShader.replace('#include <begin_vertex>',
          '#include <begin_vertex>\n  vWorldPosBP = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');
      shader.fragmentShader =
        'uniform vec3 bpProbePos;\nuniform vec3 bpBoxMin;\nuniform vec3 bpBoxMax;\nvarying vec3 vWorldPosBP;\n' +
        'vec3 bpBoxProject( vec3 dir, vec3 wpos ){ vec3 nd = normalize( dir );\n' +
        '  vec3 t1 = ( bpBoxMax - wpos ) / nd; vec3 t2 = ( bpBoxMin - wpos ) / nd; vec3 tm = max( t1, t2 );\n' +
        '  float fa = min( min( tm.x, tm.y ), tm.z ); return ( wpos + nd * fa ) - bpProbePos; }\n' +
        shader.fragmentShader.replace(
          'reflectVec = inverseTransformDirection( reflectVec, viewMatrix );',
          'reflectVec = inverseTransformDirection( reflectVec, viewMatrix );\n\t\t\treflectVec = bpBoxProject( reflectVec, vWorldPosBP );');
    }
  };
  mat.needsUpdate = true;
}

// Fuse every per-element mesh into one merged mesh per material. World transforms are
// baked into the vertices; a per-vertex _elemId (for GPU picking) and _vis (for hide)
// ride along. This drops draw calls from ~one-per-element (thousands) to one-per-material
// (dozens), which is what lets the full shadow+AO pipeline run on a huge model. Each
// element records its (mergedMesh, vStart, vCount) so visibility can address its vertices.
function buildMerged(){
  mergedRoot = new THREE.Group();
  root.updateMatrixWorld(true);
  const buckets = new Map();                 // shared material instance -> [elements]
  for (const e of elements){
    const m = e.obj;
    if (!m || !m.geometry || !m.geometry.attributes.position) continue;
    let b = buckets.get(m.material);
    if (!b){ b = []; buckets.set(m.material, b); }
    b.push(e);
  }
  buckets.forEach((els, mat) => {
    let totalVerts = 0, totalIdx = 0;
    for (const e of els){
      const g = e.obj.geometry, vc = g.attributes.position.count;
      totalVerts += vc; totalIdx += g.index ? g.index.count : vc;
    }
    const pos = new Float32Array(totalVerts * 3);
    const nrm = new Float32Array(totalVerts * 3);
    const eid = new Float32Array(totalVerts);
    const vis = new Float32Array(totalVerts); vis.fill(1);
    const idx = (totalVerts > 65535) ? new Uint32Array(totalIdx) : new Uint16Array(totalIdx);
    // carry UVs through only when the material is textured (so baseColorTexture maps);
    // untextured buckets skip them to save memory
    const hasUV = !!(mat && mat.map);
    const uvs = hasUV ? new Float32Array(totalVerts * 2) : null;
    let vOff = 0, iOff = 0;
    for (const e of els){
      const g = e.obj.geometry;
      const pa = g.attributes.position.array;
      let na = g.attributes.normal ? g.attributes.normal.array : null;
      if (!na){ g.computeVertexNormals(); na = g.attributes.normal.array; }
      const ua = (hasUV && g.attributes.uv) ? g.attributes.uv.array : null;
      const vc = g.attributes.position.count;
      const m = e.obj.matrixWorld.elements;
      const nMat = new THREE.Matrix3().getNormalMatrix(e.obj.matrixWorld).elements;
      for (let i = 0; i < vc; i++){
        const x = pa[i*3], y = pa[i*3+1], z = pa[i*3+2];
        const o3 = (vOff + i) * 3;
        pos[o3]   = m[0]*x + m[4]*y + m[8]*z  + m[12];
        pos[o3+1] = m[1]*x + m[5]*y + m[9]*z  + m[13];
        pos[o3+2] = m[2]*x + m[6]*y + m[10]*z + m[14];
        const nx = na[i*3], ny = na[i*3+1], nz = na[i*3+2];
        let tx = nMat[0]*nx + nMat[3]*ny + nMat[6]*nz;
        let ty = nMat[1]*nx + nMat[4]*ny + nMat[7]*nz;
        let tz = nMat[2]*nx + nMat[5]*ny + nMat[8]*nz;
        const len = Math.hypot(tx, ty, tz) || 1;
        nrm[o3] = tx/len; nrm[o3+1] = ty/len; nrm[o3+2] = tz/len;
        eid[vOff + i] = e.elemId;
        if (uvs){ const o2 = (vOff + i) * 2; uvs[o2] = ua ? ua[i*2] : 0; uvs[o2+1] = ua ? ua[i*2+1] : 0; }
      }
      if (g.index){ const gi = g.index; for (let k = 0; k < gi.count; k++) idx[iOff+k] = gi.getX(k) + vOff; iOff += gi.count; }
      else { for (let k = 0; k < vc; k++) idx[iOff+k] = vOff + k; iOff += vc; }
      e.vStart = vOff; e.vCount = vc;        // this element's vertex range in the merged mesh
      vOff += vc;
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geom.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geom.setAttribute('_elemId', new THREE.BufferAttribute(eid, 1));
    geom.setAttribute('_vis', new THREE.BufferAttribute(vis, 1));
    if (uvs) geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geom.setIndex(new THREE.BufferAttribute(idx, 1));
    mat.userData.__needsVis = true;            // merged meshes hide via the _vis attribute
    _injectMatShader(mat, true, false);        // box-projection added later for reflective mats
    const mesh = new THREE.Mesh(geom, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.frustumCulled = false;             // spans the whole model; per-mesh culling is moot
    mesh.userData.__merged = true;
    mergedMeshes.push(mesh);
    mergedRoot.add(mesh);
    for (const e of els) e.mergedMesh = mesh;
  });
  scene.add(mergedRoot);
}

// Robust bounds from element centers (a few stray elements can't hijack it).
function computeBounds(ctrs){
  if (!ctrs.length){ bounds = { center: new THREE.Vector3(), radius: 10, minY: -10, span: 20,
    boxMin: new THREE.Vector3(-10,-10,-10), boxMax: new THREE.Vector3(10,10,10) }; return; }
  let sx=0,sy=0,sz=0,sq=0;
  for (const c of ctrs){ sx+=c.x; sy+=c.y; sz+=c.z; sq+=c.x*c.x+c.y*c.y+c.z*c.z; }
  const n = ctrs.length, cx=sx/n, cy=sy/n, cz=sz/n;
  const rms = Math.sqrt(Math.max(0, sq/n - (cx*cx+cy*cy+cz*cz)));
  const full = new THREE.Box3().setFromObject(root);
  const fr = full.getSize(new THREE.Vector3()).length() / 2 || 10;
  bounds = { center: new THREE.Vector3(cx,cy,cz), radius: Math.min(fr, Math.max(2, rms*2.5)),
             minY: (isFinite(full.min.y) ? full.min.y : cy - fr),   // true base for the ground plane
             span: fr * 2,                                          // true diameter, for ground size
             boxMin: full.min.clone(), boxMax: full.max.clone() };  // AABB = the reflection box
}

function frameCamera(){
  const c = bounds.center, R = bounds.radius;

  camera.aspect = W/H; camera.updateProjectionMatrix();
  composer.setSize(W, H); tuneAO();
  const last = composer.passes[composer.passes.length-1]; const prev = last.renderToScreen;
  last.renderToScreen = false; composer.render(); last.renderToScreen = prev;
  // EffectComposer targets are half-float; read as Uint16 (half-float bits) and
  // just look for meaningful brightness so we can confirm the AO path isn't black.
  const rt = composer.readBuffer;
  const isHalf = rt.texture.type === THREE.HalfFloatType;
  function h2f(h){ const s=(h&0x8000)?-1:1, e=(h>>10)&0x1f, m=h&0x3ff;
    if(e===0) return s*Math.pow(2,-14)*(m/1024); if(e===31) return m?NaN:s*Infinity; return s*Math.pow(2,e-15)*(1+m/1024); }
  let nonBlack=0, brightish=0, n=W*H, maxV=0;
  if (isHalf){ const px=new Uint16Array(n*4); renderer.readRenderTargetPixels(rt,0,0,W,H,px);
    for(let i=0;i<px.length;i+=4){ const r=h2f(px[i]),g=h2f(px[i+1]),b=h2f(px[i+2]); const L=0.3*r+0.6*g+0.1*b;
      if(L>0.02)nonBlack++; if(L>0.35)brightish++; if(L>maxV)maxV=L; } }
  else { const px=new Uint8Array(n*4); renderer.readRenderTargetPixels(rt,0,0,W,H,px);
    for(let i=0;i<px.length;i+=4){ const L=(0.3*px[i]+0.6*px[i+1]+0.1*px[i+2])/255;
      if(L>0.02)nonBlack++; if(L>0.35)brightish++; if(L>maxV)maxV=L; } }
  return { half:isHalf, nonBlackPct:Math.round(100*nonBlack/n), brightishPct:Math.round(100*brightish/n),
           maxLum:Math.round(maxV*100)/100, glErr: renderer.getContext().getError() };
};

// debug: measure the ACTUAL on-screen brightness of the plain (Shaded) path vs the
// composer (Realistic) path at the same camera, to diagnose why they diverge.
window.__cmpScreen = (W, H, ax, ay, az) => {
  cam.pos = [ax, ay, az]; const c = bounds ? bounds.center : new THREE.Vector3();
  const d = [c.x-ax, c.y-ay, c.z-az], dl = Math.hypot(d[0],d[1],d[2]) || 1;
  cam.yaw = Math.atan2(d[0]/dl, -d[2]/dl); cam.pitch = Math.asin(d[1]/dl);
  renderer.setSize(W, H, false); composer.setSize(W, H);
  camera.aspect = W/H; camera.updateProjectionMatrix(); applyCameraToThree(); tuneAO();
  const gl = renderer.getContext();
  function readMean(){ const px = new Uint8Array(W*H*4); gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
    let s=0, mx=0, n=W*H; for (let i=0;i<px.length;i+=4){ const L=(0.3*px[i]+0.6*px[i+1]+0.1*px[i+2])/255; s+=L; if(L>mx)mx=L; }
    return { mean: Math.round(s/n*1000)/1000, max: Math.round(mx*1000)/1000 }; }
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
  const plain = readMean();
  composer.render(); blitComposerToScreen();
  const comp = readMean();
  // composer WITHOUT OutputPass (blit the N8AO output directly) -- tests whether
  // OutputPass is the extra sRGB encode
  let compNoOut = null;
  if (composer.passes.length > 1 && composer.passes[composer.passes.length-1].constructor.name === 'OutputPass'){
    const op = composer.passes.pop();
    composer.render(); blitComposerToScreen();
    compNoOut = readMean();
    composer.passes.push(op);
  }
  return { plain, composerBlit: comp, composerNoOutput: compNoOut };
};
// ---------- loop ----------
function resize(){ const w=canvas.clientWidth, h=canvas.clientHeight;
  if (canvas.width!==w || canvas.height!==h){ renderer.setSize(w,h,false); composer.setSize(w,h);
    camera.aspect=w/Math.max(1,h); camera.updateProjectionMatrix(); } }
function frame(t){
  requestAnimationFrame(frame);
  if (glLost) return;   // context is dead; don't throw on every frame trying to draw
  const dt = prevT ? Math.min(0.05, (t-prevT)/1000) : 0.016; prevT=t;
  const pads = navigator.getGamepads ? navigator.getGamepads() : []; let gp=null;
  for (const p of pads){ if (p){ gp=p; break; } }
  if (gp){ const dz=v=>Math.abs(v)<0.16?0:v; cam.yaw+=dz(gp.axes[2]||0)*2.4*dt; cam.pitch-=dz(gp.axes[3]||0)*2.4*dt;
    cam.pitch=Math.max(-PITCH_LIMIT,Math.min(PITCH_LIMIT,cam.pitch)); }
  applyMovement(dt, gp);
  updateFly();
  updateClip();
  applyCameraToThree();
  reportCam(t);
  resize();
  if (aoEnabled && composerOK && root){ composer.render(); blitComposerToScreen(); }
  else renderer.render(scene, camera);
}
showHint('Ready. Export & load a model to begin.');
requestAnimationFrame(frame);
</script>
