<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dbHMS 3D Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1A202C; }
  #c { width: 100%; height: 100%; display: block; cursor: grab; }
  #c:active { cursor: grabbing; }
  #badge {
    position: fixed; left: 12px; bottom: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px;
    color: #CBD5E0; background: rgba(45, 55, 72, 0.65);
    padding: 6px 11px; border-radius: 4px; user-select: none; pointer-events: none;
  }
  #badge .db { color: #00BFFF; font-weight: 700; }
  #badge .sep { color: #7A8FA6; font-weight: 300; }
  #hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px;
    color: #718096; text-align: center; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click <b>Export &amp; Load Model</b> to load the model here.</div>
<div id="badge"><span class="db">db</span><span class="sep"> | </span><span class="db">HMS</span>&nbsp;&nbsp;3D Viewer</div>

<script>
"use strict";

var canvas = document.getElementById("c");
var badge = document.getElementById("badge");
var hint = document.getElementById("hint");
var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");

// Per-fragment flat shading via screen-space derivatives + 32-bit indices so
// big indexed meshes stay compact on the GPU (no normal attribute, no
// expansion to non-indexed).
var VS = [
  "attribute vec3 aPos;",
  "uniform mat4 uMVP;",
  "varying vec3 vWorld;",
  "void main() { gl_Position = uMVP * vec4(aPos, 1.0); vWorld = aPos; }"
].join("\n");

var FS = [
  "#extension GL_OES_standard_derivatives : enable",
  "precision mediump float;",
  "varying vec3 vWorld;",
  "uniform vec3 uColor;",
  "uniform vec3 uCameraPos;",
  "void main() {",
  "  vec3 N = normalize(cross(dFdx(vWorld), dFdy(vWorld)));",
  "  vec3 L = normalize(uCameraPos - vWorld);",
  "  float d = abs(dot(N, L));",
  "  float lit = 0.35 + 0.65 * d;",
  "  gl_FragColor = vec4(uColor * lit, 1.0);",
  "}"
].join("\n");

var program = null, loc = {};
var groups = [];                  // {posBuf, idxBuf, count, color}
var bounds = null;
var cam = { az: 0.9, el: 0.5, dist: 20, target: [0, 0, 0] };
var dragging = false, lastX = 0, lastY = 0;

// ---------------------------------------------------------------- matrices
function perspective(fovy, aspect, near, far) {
  var f = 1.0 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0,
          0, 0, (far + near) * nf, -1, 0, 0, (2 * far * near) * nf, 0];
}
function multiply(a, b) {
  var o = new Array(16);
  for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] +
                   a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}
function lookAt(eye, center, up) {
  var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
  var zl = Math.hypot(zx, zy, zz) || 1; var z = [zx / zl, zy / zl, zz / zl];
  var xx = up[1] * z[2] - up[2] * z[1], xy = up[2] * z[0] - up[0] * z[2],
      xz = up[0] * z[1] - up[1] * z[0];
  var xl = Math.hypot(xx, xy, xz) || 1; var x = [xx / xl, xy / xl, xz / xl];
  var y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2],
           z[0] * x[1] - z[1] * x[0]];
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
          -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]),
          -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]),
          -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]), 1];
}
function cameraPos() {
  var ce = Math.cos(cam.el), se = Math.sin(cam.el);
  var ca = Math.cos(cam.az), sa = Math.sin(cam.az);
  return [cam.target[0] + cam.dist * ce * sa, cam.target[1] + cam.dist * se,
          cam.target[2] + cam.dist * ce * ca];
}

// ---------------------------------------------------------------- gl setup
function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function setupGL() {
  gl.getExtension("OES_standard_derivatives");   // flat normals in the shader
  gl.getExtension("OES_element_index_uint");      // 32-bit indices
  program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  loc.aPos = gl.getAttribLocation(program, "aPos");
  loc.uMVP = gl.getUniformLocation(program, "uMVP");
  loc.uColor = gl.getUniformLocation(program, "uColor");
  loc.uCameraPos = gl.getUniformLocation(program, "uCameraPos");
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.102, 0.125, 0.157, 1.0);
}

// ---------------------------------------------------------------- glb parse
function parseGlb(buffer) {
  var dv = new DataView(buffer);
  var length = dv.getUint32(8, true);
  var off = 12, json = null, bin = null;
  while (off < length) {
    var clen = dv.getUint32(off, true); off += 4;
    var ctype = dv.getUint32(off, true); off += 4;
    if (ctype === 0x4E4F534A) {
      json = JSON.parse(new TextDecoder("utf-8").decode(new Uint8Array(buffer, off, clen)));
    } else if (ctype === 0x004E4942) {
      bin = new Uint8Array(buffer, off, clen);
    }
    off += clen;
  }
  return { json: json, bin: bin };
}

function buildPrimitives(gltf, bin) {
  var binBuf = bin.buffer, base = bin.byteOffset, prims = [];
  var nodes = gltf.nodes || [];
  for (var n = 0; n < nodes.length; n++) {
    if (nodes[n].mesh === undefined) continue;
    var mesh = gltf.meshes[nodes[n].mesh];
    for (var p = 0; p < mesh.primitives.length; p++) {
      var prim = mesh.primitives[p];
      var pacc = gltf.accessors[prim.attributes.POSITION];
      var pbv = gltf.bufferViews[pacc.bufferView];
      var positions = new Float32Array(binBuf, base + (pbv.byteOffset || 0), pacc.count * 3);
      var indices = null;
      if (prim.indices !== undefined) {
        var iacc = gltf.accessors[prim.indices];
        var ibv = gltf.bufferViews[iacc.bufferView];
        indices = new Uint32Array(binBuf, base + (ibv.byteOffset || 0), iacc.count);
      }
      var color = [0.7, 0.72, 0.74];
      if (prim.material !== undefined) {
        var bcf = gltf.materials[prim.material].pbrMetallicRoughness.baseColorFactor;
        if (bcf) color = [bcf[0], bcf[1], bcf[2]];
      }
      prims.push({ positions: positions, indices: indices, color: color });
    }
  }
  return prims;
}

// Merge primitives that share a color into one buffer each, so the whole
// model draws in a handful of GL calls instead of one per element.
function mergeByColor(prims) {
  var byKey = {};
  for (var i = 0; i < prims.length; i++) {
    var p = prims[i];
    var key = Math.round(p.color[0] * 255) + "," + Math.round(p.color[1] * 255) +
              "," + Math.round(p.color[2] * 255);
    if (!byKey[key]) byKey[key] = { color: p.color, prims: [] };
    byKey[key].prims.push(p);
  }
  var out = [];
  for (var k in byKey) {
    var g = byKey[k], totalV = 0, totalI = 0, j;
    for (j = 0; j < g.prims.length; j++) {
      totalV += g.prims[j].positions.length;
      totalI += g.prims[j].indices ? g.prims[j].indices.length
                                   : g.prims[j].positions.length / 3;
    }
    var pos = new Float32Array(totalV), idx = new Uint32Array(totalI);
    var vo = 0, io = 0, baseVert = 0;
    for (j = 0; j < g.prims.length; j++) {
      var pr = g.prims[j], nv = pr.positions.length / 3, x;
      pos.set(pr.positions, vo);
      if (pr.indices) {
        for (x = 0; x < pr.indices.length; x++) idx[io + x] = pr.indices[x] + baseVert;
        io += pr.indices.length;
      } else {
        for (x = 0; x < nv; x++) idx[io + x] = baseVert + x;
        io += nv;
      }
      vo += pr.positions.length; baseVert += nv;
    }
    out.push({ positions: pos, indices: idx, color: g.color });
  }
  return out;
}

function loadModel(buffer) {
  var parsed = parseGlb(buffer);
  if (!parsed.json || !parsed.bin) { hint.style.display = "block"; hint.textContent = "Could not read model file."; return; }
  for (var i = 0; i < groups.length; i++) { gl.deleteBuffer(groups[i].posBuf); gl.deleteBuffer(groups[i].idxBuf); }
  groups = [];

  var merged = mergeByColor(buildPrimitives(parsed.json, parsed.bin));
  var mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  var totalTris = 0;
  for (var m = 0; m < merged.length; m++) {
    var grp = merged[m];
    if (grp.indices.length === 0) continue;
    var posBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, grp.positions, gl.STATIC_DRAW);
    var idxBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, grp.indices, gl.STATIC_DRAW);
    groups.push({ posBuf: posBuf, idxBuf: idxBuf, count: grp.indices.length, color: grp.color });
    totalTris += grp.indices.length / 3;
    var pp = grp.positions;
    for (var v = 0; v < pp.length; v += 3) {
      if (pp[v] < mn[0]) mn[0] = pp[v]; if (pp[v] > mx[0]) mx[0] = pp[v];
      if (pp[v + 1] < mn[1]) mn[1] = pp[v + 1]; if (pp[v + 1] > mx[1]) mx[1] = pp[v + 1];
      if (pp[v + 2] < mn[2]) mn[2] = pp[v + 2]; if (pp[v + 2] > mx[2]) mx[2] = pp[v + 2];
    }
  }
  if (groups.length === 0) { hint.style.display = "block"; hint.textContent = "Model had no geometry."; return; }

  bounds = {
    center: [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2],
    radius: Math.max(0.001, Math.hypot(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]) / 2)
  };
  cam.target = bounds.center.slice();
  cam.dist = bounds.radius * 2.6; cam.az = 0.9; cam.el = 0.5;
  hint.style.display = "none";
  badge.innerHTML = '<span class="db">db</span><span class="sep"> | </span><span class="db">HMS</span>&nbsp;&nbsp;' +
    Math.round(totalTris).toLocaleString() + ' triangles, ' + groups.length + ' groups';
}

// ---------------------------------------------------------------- render
function resize() {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
function frame() {
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (groups.length > 0) {
    var aspect = canvas.width / Math.max(1, canvas.height);
    var eye = cameraPos();
    var proj = perspective(50 * Math.PI / 180, aspect,
                           Math.max(0.01, cam.dist * 0.01), cam.dist * 10 + 100);
    var mvp = multiply(proj, lookAt(eye, cam.target, [0, 1, 0]));
    gl.uniformMatrix4fv(loc.uMVP, false, new Float32Array(mvp));
    gl.uniform3fv(loc.uCameraPos, new Float32Array(eye));
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      gl.bindBuffer(gl.ARRAY_BUFFER, g.posBuf);
      gl.enableVertexAttribArray(loc.aPos);
      gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.uniform3fv(loc.uColor, new Float32Array(g.color));
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, g.idxBuf);
      gl.drawElements(gl.TRIANGLES, g.count, gl.UNSIGNED_INT, 0);
    }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- orbit
canvas.addEventListener("mousedown", function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mouseup", function () { dragging = false; });
window.addEventListener("mousemove", function (e) {
  if (!dragging) return;
  cam.az -= (e.clientX - lastX) * 0.01;
  cam.el += (e.clientY - lastY) * 0.01;
  var lim = Math.PI / 2 - 0.05;
  if (cam.el > lim) cam.el = lim; if (cam.el < -lim) cam.el = -lim;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  cam.dist *= (e.deltaY > 0) ? 1.1 : 0.9;
  if (bounds && cam.dist < bounds.radius * 0.02) cam.dist = bounds.radius * 0.02;
}, { passive: false });

// ---------------------------------------------------------------- bootstrap
function b64ToBuffer(b64) {
  var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function loadModelFromUrl(url) {
  hint.style.display = "block"; hint.textContent = "Loading model...";
  fetch(url).then(function (r) { return r.arrayBuffer(); })
    .then(function (buf) { loadModel(buf); })
    .catch(function (err) {
      hint.style.display = "block";
      hint.textContent = "Failed to load model: " + (err && err.message ? err.message : err);
    });
}

if (!gl) {
  hint.textContent = "WebGL is not available in this panel.";
} else {
  setupGL();
  requestAnimationFrame(frame);
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener("message", function (e) {
      try {
        var data = e.data;
        if (typeof data === "string" && data.indexOf("http") === 0) {
          loadModelFromUrl(data);                 // streamed: a model URL
        } else {
          hint.style.display = "block"; hint.textContent = "Loading model...";
          loadModel(b64ToBuffer(data));           // small: inline base64
        }
      } catch (err) {
        hint.style.display = "block";
        hint.textContent = "Failed to load model: " + (err && err.message ? err.message : err);
      }
    });
  }
}
</script>
</body>
</html>
