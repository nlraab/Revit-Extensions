<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dbHMS 3D Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1A202C; }
  /* Default arrow cursor: in normal mode you click to select; drag looks
     around. F-mouselook hides the cursor via pointer lock. (No grab-hand,
     which wrongly implied panning.) */
  #c { width: 100%; height: 100%; display: block; cursor: default; }
  #badge {
    position: fixed; left: 12px; bottom: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
    color: #CBD5E0; background: rgba(45, 55, 72, 0.72);
    padding: 6px 12px; border-radius: 4px; user-select: none; pointer-events: none;
  }
  #badge .db { color: #00BFFF; font-weight: 700; } #badge .sep { color: #7A8FA6; }
  #hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px;
    color: #718096; text-align: center; user-select: none; pointer-events: none;
    max-width: 80%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Loading viewer...</div>
<div id="badge"><span class="db">db</span><span class="sep"> | </span><span class="db">HMS</span></div>

<script>
"use strict";

var canvas = document.getElementById("c");
var hint = document.getElementById("hint");
var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");

// Navigation tuning is pushed from the control panel (WPF) via messages, so
// it lives on the user's screen, not on the shared render.
var userSpeed = 4.0;     // metres/sec
var userLook = 0.10;     // degrees per pixel

// Free-fly camera: position + yaw/pitch, eased velocity for smooth motion.
var cam = { pos: [0, 0, 0], yaw: 0, pitch: 0 };
var vel = [0, 0, 0];
var keys = {};
var dragMode = null;     // "pan" (middle-drag) | null  (look uses pointer lock)
var rightLook = false;   // right button held -> pointer-lock look (no edge limit)
var lastX = 0, lastY = 0, locked = false;
var prevT = 0;
var PITCH_LIMIT = Math.PI / 2 - 0.02;

function moveSpeed() { return userSpeed; }
function lookRad() { return userLook * Math.PI / 180; }
function forwardVec() {
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return [cp * Math.sin(cam.yaw), sp, -cp * Math.cos(cam.yaw)];
}
function rightVec() { return [Math.cos(cam.yaw), 0, Math.sin(cam.yaw)]; }

var VS = [
  "attribute vec3 aPos;", "uniform mat4 uMVP;", "varying vec3 vWorld;",
  "void main() { gl_Position = uMVP * vec4(aPos, 1.0); vWorld = aPos; }"
].join("\n");
var FS = [
  "#extension GL_OES_standard_derivatives : enable",
  "precision mediump float;",
  "varying vec3 vWorld;", "uniform vec3 uColor; uniform vec3 uCameraPos;",
  "void main() {",
  "  vec3 N = normalize(cross(dFdx(vWorld), dFdy(vWorld)));",
  "  vec3 L = normalize(uCameraPos - vWorld);",
  "  gl_FragColor = vec4(uColor * (0.35 + 0.65 * abs(dot(N, L))), 1.0);",
  "}"
].join("\n");

var program = null, loc = {}, groups = [], bounds = null;
var SEP = "||";    // model<->category key separator (safe in Revit names)
var hiddenModel = {};  // model name -> true if the whole model is hidden
var hiddenCat = {};    // "model<SEP>category" -> true if that category is hidden
var hiddenWs = {};     // "model<SEP>workset"  -> true if that workset is hidden
function catKey(g) { return g.model + SEP + g.category; }
function wsKey(g) { return g.model + SEP + g.workset; }
function recomputeVisibility() {
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    g.visible = !(hiddenModel[g.model] || hiddenCat[catKey(g)] || hiddenWs[wsKey(g)]);
  }
}

function perspective(fovy, aspect, near, far) {
  var f = 1.0 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0,
          0, 0, (far + near) * nf, -1, 0, 0, (2 * far * near) * nf, 0];
}
function multiply(a, b) {
  var o = new Array(16);
  for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] +
                   a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}
function lookAt(eye, center, up) {
  var zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
  var zl = Math.hypot(zx, zy, zz) || 1; var z = [zx/zl, zy/zl, zz/zl];
  var xx = up[1]*z[2]-up[2]*z[1], xy = up[2]*z[0]-up[0]*z[2], xz = up[0]*z[1]-up[1]*z[0];
  var xl = Math.hypot(xx, xy, xz) || 1; var x = [xx/xl, xy/xl, xz/xl];
  var y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
          -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]), -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
          -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1];
}

function compile(type, src) {
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function setupGL() {
  gl.getExtension("OES_standard_derivatives");
  gl.getExtension("OES_element_index_uint");
  program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  loc.aPos = gl.getAttribLocation(program, "aPos");
  loc.uMVP = gl.getUniformLocation(program, "uMVP");
  loc.uColor = gl.getUniformLocation(program, "uColor");
  loc.uCameraPos = gl.getUniformLocation(program, "uCameraPos");
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.102, 0.125, 0.157, 1.0);
}

function parseGlb(buffer) {
  var dv = new DataView(buffer), length = dv.getUint32(8, true), off = 12, json = null, bin = null;
  while (off < length) {
    var clen = dv.getUint32(off, true); off += 4;
    var ctype = dv.getUint32(off, true); off += 4;
    if (ctype === 0x4E4F534A) json = JSON.parse(new TextDecoder("utf-8").decode(new Uint8Array(buffer, off, clen)));
    else if (ctype === 0x004E4942) bin = new Uint8Array(buffer, off, clen);
    off += clen;
  }
  return { json: json, bin: bin };
}
function buildPrimitives(gltf, bin) {
  var binBuf = bin.buffer, base = bin.byteOffset, prims = [], nodes = gltf.nodes || [];
  for (var n = 0; n < nodes.length; n++) {
    if (nodes[n].mesh === undefined) continue;
    var mesh = gltf.meshes[nodes[n].mesh];
    var extras = nodes[n].extras || {};
    for (var p = 0; p < mesh.primitives.length; p++) {
      var prim = mesh.primitives[p];
      var pacc = gltf.accessors[prim.attributes.POSITION], pbv = gltf.bufferViews[pacc.bufferView];
      var positions = new Float32Array(binBuf, base + (pbv.byteOffset || 0), pacc.count * 3);
      var indices = null;
      if (prim.indices !== undefined) {
        var iacc = gltf.accessors[prim.indices], ibv = gltf.bufferViews[iacc.bufferView];
        indices = new Uint32Array(binBuf, base + (ibv.byteOffset || 0), iacc.count);
      }
      var color = [0.7, 0.72, 0.74];
      if (prim.material !== undefined) {
        var bcf = gltf.materials[prim.material].pbrMetallicRoughness.baseColorFactor;
        if (bcf) color = [bcf[0], bcf[1], bcf[2]];
      }
      prims.push({ positions: positions, indices: indices, color: color,
                   category: extras.category || "Other",
                   model: extras.model || "Model",
                   workset: extras.workset || "" });
    }
  }
  return prims;
}
// Merge by (model, category, workset) so we can show/hide a whole model, an
// individual category, or a workset within a model, while keeping draw calls
// low.
function mergeByModelCat(prims) {
  var byKey = {};
  for (var i = 0; i < prims.length; i++) {
    var p = prims[i];
    var key = p.model + SEP + p.category + SEP + p.workset;
    if (!byKey[key]) byKey[key] = { color: p.color, model: p.model, category: p.category, workset: p.workset, prims: [] };
    byKey[key].prims.push(p);
  }
  var out = [];
  for (var k in byKey) {
    var g = byKey[k], totalV = 0, totalI = 0, j;
    for (j = 0; j < g.prims.length; j++) {
      totalV += g.prims[j].positions.length;
      totalI += g.prims[j].indices ? g.prims[j].indices.length : g.prims[j].positions.length / 3;
    }
    var pos = new Float32Array(totalV), idx = new Uint32Array(totalI), vo = 0, io = 0, baseVert = 0;
    for (j = 0; j < g.prims.length; j++) {
      var pr = g.prims[j], nv = pr.positions.length / 3, x;
      pos.set(pr.positions, vo);
      if (pr.indices) { for (x = 0; x < pr.indices.length; x++) idx[io+x] = pr.indices[x] + baseVert; io += pr.indices.length; }
      else { for (x = 0; x < nv; x++) idx[io+x] = baseVert + x; io += nv; }
      vo += pr.positions.length; baseVert += nv;
    }
    out.push({ positions: pos, indices: idx, color: g.color, model: g.model, category: g.category, workset: g.workset });
  }
  return out;
}
function loadModel(buffer) {
  var parsed = parseGlb(buffer);
  if (!parsed.json || !parsed.bin) { showHint("Could not read model file."); return; }
  for (var i = 0; i < groups.length; i++) { gl.deleteBuffer(groups[i].posBuf); gl.deleteBuffer(groups[i].idxBuf); }
  groups = [];
  hiddenModel = {}; hiddenCat = {}; hiddenWs = {};
  var merged = mergeByModelCat(buildPrimitives(parsed.json, parsed.bin));
  var mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  for (var m = 0; m < merged.length; m++) {
    var grp = merged[m];
    if (grp.indices.length === 0) continue;
    var posBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, grp.positions, gl.STATIC_DRAW);
    var idxBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, grp.indices, gl.STATIC_DRAW);
    groups.push({ posBuf: posBuf, idxBuf: idxBuf, count: grp.indices.length, color: grp.color,
                  model: grp.model, category: grp.category, workset: grp.workset, visible: true });
    var pp = grp.positions;
    for (var v = 0; v < pp.length; v += 3) {
      if (pp[v] < mn[0]) mn[0] = pp[v]; if (pp[v] > mx[0]) mx[0] = pp[v];
      if (pp[v+1] < mn[1]) mn[1] = pp[v+1]; if (pp[v+1] > mx[1]) mx[1] = pp[v+1];
      if (pp[v+2] < mn[2]) mn[2] = pp[v+2]; if (pp[v+2] > mx[2]) mx[2] = pp[v+2];
    }
  }
  if (groups.length === 0) { showHint("Model had no geometry."); return; }
  reportFilters();
  bounds = {
    center: [(mn[0]+mx[0])/2, (mn[1]+mx[1])/2, (mn[2]+mx[2])/2],
    radius: Math.max(0.001, Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]) / 2)
  };
  var c = bounds.center, R = bounds.radius;
  cam.pos = [c[0] + R*0.9, c[1] + R*0.5, c[2] + R*1.7];
  var dir = [c[0]-cam.pos[0], c[1]-cam.pos[1], c[2]-cam.pos[2]];
  var dl = Math.hypot(dir[0], dir[1], dir[2]) || 1; dir = [dir[0]/dl, dir[1]/dl, dir[2]/dl];
  cam.yaw = Math.atan2(dir[0], -dir[2]);
  cam.pitch = Math.asin(Math.max(-1, Math.min(1, dir[1])));
  vel = [0, 0, 0];
  hint.style.display = "none";
}

// --- gamepad (Xbox) ---
// Left stick: fly (forward/back + strafe, analog). Right stick: look.
// RB/LB: up/down. RT: faster. Standard mapping; tune in testing.
var GP_DEADZONE = 0.16;
var GP_LOOK = 2.4;   // radians/sec at full right-stick deflection
function dz(v) { return Math.abs(v) < GP_DEADZONE ? 0 : v; }
function activeGamepad() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < pads.length; i++) { if (pads[i]) return pads[i]; }
  return null;
}
function gpButton(gp, i) { return gp.buttons[i] ? gp.buttons[i] : { pressed: false, value: 0 }; }

function applyMovement(dt, gp) {
  var sp = moveSpeed();
  var f = forwardVec(), r = rightVec(), d = [0, 0, 0];
  // keyboard (full deflection)
  if (keys["w"]) { d[0]+=f[0]; d[1]+=f[1]; d[2]+=f[2]; }
  if (keys["s"]) { d[0]-=f[0]; d[1]-=f[1]; d[2]-=f[2]; }
  if (keys["d"]) { d[0]+=r[0]; d[2]+=r[2]; }
  if (keys["a"]) { d[0]-=r[0]; d[2]-=r[2]; }
  if (keys["e"]) { d[1]+=1; }
  if (keys["q"]) { d[1]-=1; }
  var boost = keys["shift"] ? 3.0 : 1.0;
  // gamepad (analog left stick)
  if (gp) {
    var lx = dz(gp.axes[0] || 0), ly = dz(gp.axes[1] || 0);
    d[0] += f[0]*(-ly) + r[0]*lx; d[1] += f[1]*(-ly); d[2] += f[2]*(-ly) + r[2]*lx;
    d[1] += (gpButton(gp, 5).pressed ? 1 : 0) - (gpButton(gp, 4).pressed ? 1 : 0);
    if (gpButton(gp, 7).value > 0.5) boost = 3.0;
  }
  sp *= boost;
  // analog-aware target velocity: stick partway = move partway; keys = full.
  var mag = Math.hypot(d[0], d[1], d[2]), target = [0, 0, 0];
  if (mag > 0) { var s = Math.min(mag, 1) * sp / mag; target = [d[0]*s, d[1]*s, d[2]*s]; }
  var k = Math.min(1, dt * 9);
  vel[0]+=(target[0]-vel[0])*k; vel[1]+=(target[1]-vel[1])*k; vel[2]+=(target[2]-vel[2])*k;
  cam.pos[0]+=vel[0]*dt; cam.pos[1]+=vel[1]*dt; cam.pos[2]+=vel[2]*dt;
}
function applyLook(dx, dy) {
  cam.yaw += dx * lookRad();
  cam.pitch -= dy * lookRad();
  if (cam.pitch > PITCH_LIMIT) cam.pitch = PITCH_LIMIT;
  if (cam.pitch < -PITCH_LIMIT) cam.pitch = -PITCH_LIMIT;
}
function applyPan(dx, dy) {
  // grab-and-drag: the scene follows the cursor (camera moves opposite).
  var f = forwardVec(), r = rightVec();
  var up = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]]; // right x forward
  var s = (bounds ? bounds.radius : 10) * 0.0005;   // gentle pan
  cam.pos[0] += (-r[0]*dx + up[0]*dy) * s;
  cam.pos[1] += (-r[1]*dx + up[1]*dy) * s;
  cam.pos[2] += (-r[2]*dx + up[2]*dy) * s;
}

function resize() {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
function frame(now) {
  var t = (typeof now === "number") ? now : 0;
  var dt = prevT ? Math.min(0.05, (t - prevT) / 1000) : 0.016;
  prevT = t;
  var gp = activeGamepad();
  if (gp) {                                  // right stick looks
    var rx = dz(gp.axes[2] || 0), ry = dz(gp.axes[3] || 0);
    cam.yaw += rx * GP_LOOK * dt;
    cam.pitch -= ry * GP_LOOK * dt;
    if (cam.pitch > PITCH_LIMIT) cam.pitch = PITCH_LIMIT;
    if (cam.pitch < -PITCH_LIMIT) cam.pitch = -PITCH_LIMIT;
  }
  applyMovement(dt, gp);
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (groups.length > 0) {
    var aspect = canvas.width / Math.max(1, canvas.height);
    var eye = cam.pos, fwd = forwardVec();
    var near = bounds ? Math.max(0.02, bounds.radius * 0.002) : 0.1;
    var far = bounds ? bounds.radius * 8 + 100 : 1000;
    var mvp = multiply(perspective(60 * Math.PI / 180, aspect, near, far),
                       lookAt(eye, [eye[0]+fwd[0], eye[1]+fwd[1], eye[2]+fwd[2]], [0, 1, 0]));
    gl.uniformMatrix4fv(loc.uMVP, false, new Float32Array(mvp));
    gl.uniform3fv(loc.uCameraPos, new Float32Array(eye));
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (!g.visible) continue;
      gl.bindBuffer(gl.ARRAY_BUFFER, g.posBuf);
      gl.enableVertexAttribArray(loc.aPos);
      gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.uniform3fv(loc.uColor, new Float32Array(g.color));
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, g.idxBuf);
      gl.drawElements(gl.TRIANGLES, g.count, gl.UNSIGNED_INT, 0);
    }
  }
  requestAnimationFrame(frame);
}

// ---- input ----
// Left = select (reserved, not wired). Right-drag = look. Middle-drag = pan.
// Scroll = zoom. F = mouselook. WASD always flies, including while dragging.
canvas.addEventListener("mousedown", function (e) {
  if (e.button === 2) {
    // Right-drag look. Pointer-lock so the cursor never stops at a screen
    // edge — keep turning indefinitely. Released on right mouseup.
    if (!locked && canvas.requestPointerLock) { rightLook = true; canvas.requestPointerLock(); }
    e.preventDefault();
    return;
  }
  if (locked) return;
  if (e.button === 1) { dragMode = "pan"; canvas.style.cursor = "move"; lastX = e.clientX; lastY = e.clientY; e.preventDefault(); }
  // left button (0): reserved for element selection (not wired)
});
window.addEventListener("mouseup", function (e) {
  if (rightLook && e.button === 2) { rightLook = false; if (document.exitPointerLock) document.exitPointerLock(); }
  dragMode = null; canvas.style.cursor = "default";
});
window.addEventListener("mousemove", function (e) {
  if (locked) { applyLook(e.movementX || 0, e.movementY || 0); return; }  // F-mode or right-drag
  if (dragMode === "pan") {
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyPan(dx, dy);
  }
});
// Right-drag looks, so suppress the context menu over the canvas.
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  var f = forwardVec(), step = (bounds ? bounds.radius * 0.012 : 0.3) * (e.deltaY < 0 ? 1 : -1);
  cam.pos[0]+=f[0]*step; cam.pos[1]+=f[1]*step; cam.pos[2]+=f[2]*step;
}, { passive: false });
document.addEventListener("pointerlockchange", function () {
  locked = (document.pointerLockElement === canvas);
  if (!locked) rightLook = false;
});
window.addEventListener("keydown", function (e) {
  var k = e.key.toLowerCase();
  if (k === "escape") {
    // Tell the tool to drop full screen (so a single-screen user is never
    // trapped). Pointer lock also releases on Escape automatically.
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("escape");
    return;
  }
  if (k === "f") { if (locked) document.exitPointerLock(); else if (canvas.requestPointerLock) canvas.requestPointerLock(); e.preventDefault(); return; }
  if (k === "shift") { keys["shift"] = true; return; }
  if ("wasdqe".indexOf(k) >= 0) { keys[k] = true; e.preventDefault(); }
});
window.addEventListener("keyup", function (e) { var k = e.key.toLowerCase(); keys[k === "shift" ? "shift" : k] = false; });
window.addEventListener("blur", function () { keys = {}; dragMode = null; canvas.style.cursor = "default"; });

// ---- bootstrap + control-panel messages ----
function showHint(t) { hint.style.display = "block"; hint.textContent = t; }
function showLoading() { showHint("Loading model..."); }
function b64ToBuffer(b64) {
  var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function loadModelFromUrl(url) {
  showLoading();
  fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (buf) { loadModel(buf); })
    .catch(function (err) { showHint("Failed to load model: " + (err && err.message ? err.message : err)); });
}
// After a model loads, tell the control panel which models are present and
// the categories within each, so it can build the model -> categories tree.
function reportFilters() {
  if (!(window.chrome && window.chrome.webview)) return;
  var byModel = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i], m = g.model || "Model";
    if (!byModel[m]) byModel[m] = { cats: {}, ws: {} };
    byModel[m].cats[g.category || "Other"] = true;
    if (g.workset) byModel[m].ws[g.workset] = true;
  }
  var models = Object.keys(byModel).sort().map(function (m) {
    return { name: m,
             categories: Object.keys(byModel[m].cats).sort(),
             worksets: Object.keys(byModel[m].ws).sort() };
  });
  window.chrome.webview.postMessage("filters:" + JSON.stringify({ models: models }));
}

// Messages from the WPF control panel:
//   "url:<href>" / "b64:<data>"     -> load model
//   "speed:<m/s>" / "look:<deg/px>" -> nav tuning
//   "vis:model:<0|1>:<model>"               -> show/hide a whole model
//   "vis:cat:<0|1>:<model>||<category>"     -> show/hide a category in a model
//   "vis:ws:<0|1>:<model>||<workset>"       -> show/hide a workset in a model
function handleMessage(data) {
  if (typeof data !== "string") return;
  var i = data.indexOf(":"); if (i < 0) return;
  var cmd = data.slice(0, i), arg = data.slice(i + 1);
  try {
    if (cmd === "url") loadModelFromUrl(arg);
    else if (cmd === "b64") { showLoading(); loadModel(b64ToBuffer(arg)); }
    else if (cmd === "speed") { var s = parseFloat(arg); if (!isNaN(s)) userSpeed = s; }
    else if (cmd === "look") { var l = parseFloat(arg); if (!isNaN(l)) userLook = l; }
    else if (cmd === "vis") {
      // arg = "<kind>:<0|1>:<value>"  (value may contain colons / the || sep)
      var d1 = arg.indexOf(":"), kind = arg.slice(0, d1);
      var rest = arg.slice(d1 + 1), d2 = rest.indexOf(":");
      var shown = rest.slice(0, d2) === "1", value = rest.slice(d2 + 1);
      var set = (kind === "model") ? hiddenModel : (kind === "cat") ? hiddenCat
                : (kind === "ws") ? hiddenWs : null;
      if (set) { if (shown) delete set[value]; else set[value] = true; recomputeVisibility(); }
    }
  } catch (err) { showHint("Error: " + (err && err.message ? err.message : err)); }
}

if (!gl) {
  showHint("WebGL is not available in this panel.");
} else {
  setupGL();
  showHint("Use Export & Load Model or Load Last Export to begin.");
  requestAnimationFrame(frame);
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener("message", function (e) { handleMessage(e.data); });
  }
}
</script>
</body>
</html>
